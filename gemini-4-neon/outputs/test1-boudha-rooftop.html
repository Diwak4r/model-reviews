<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boudha Rooftop — Kathmandu Valley</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-deep: #05070d;
      --ink-primary: rgba(249, 241, 226, 0.92);
      --ink-secondary: rgba(235, 212, 178, 0.58);
      --ink-muted: rgba(235, 224, 206, 0.36);
      --glass-bg: rgba(10, 13, 22, 0.52);
      --glass-hover: rgba(22, 27, 42, 0.74);
      --glass-border: rgba(255, 236, 204, 0.16);
      --glass-active-border: rgba(255, 198, 114, 0.56);
      --accent-gold: #ffd99c;
      --accent-amber: #ffaa4c;
      --ease-cinema: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink-primary);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* ===================================================================== */
    /* LOADING CURTAIN (Brief atmospheric fade-in while procedural baking runs) */
    /* ===================================================================== */
    #loading-curtain {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at 50% 45%, #121728 0%, #05070d 72%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 1.3s var(--ease-cinema), visibility 1.3s var(--ease-cinema);
    }

    #loading-curtain.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-emblem {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid rgba(255, 204, 128, 0.25);
      border-top-color: rgba(255, 204, 128, 0.9);
      animation: spinEmblem 1.6s linear infinite;
      position: relative;
    }

    .loader-emblem::after {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      border: 1px solid rgba(255, 204, 128, 0.14);
      border-bottom-color: rgba(255, 168, 76, 0.65);
      animation: spinEmblem 2.4s linear infinite reverse;
    }

    @keyframes spinEmblem {
      to { transform: rotate(360deg); }
    }

    .loader-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(248, 238, 218, 0.88);
    }

    .loader-sub {
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(235, 206, 168, 0.5);
    }

    /* ===================================================================== */
    /* ANAMORPHIC 2.39:1 LETTERBOX BARS                                      */
    /* ===================================================================== */
    .letterbox {
      position: fixed;
      left: 0;
      right: 0;
      height: 0;
      background: #040508;
      z-index: 15;
      pointer-events: none;
      transition: height 0.75s var(--ease-cinema);
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }
    body.cinema-bars .letterbox {
      height: 6.4vh;
    }

    /* ===================================================================== */
    /* CINEMATIC FILM-STILL HUD                                              */
    /* ===================================================================== */
    .hud-layer {
      transition: opacity 0.6s var(--ease-cinema);
    }
    body.hud-hidden .hud-layer {
      opacity: 0;
      pointer-events: none;
    }

    .hud-title {
      position: fixed;
      top: 26px;
      left: 32px;
      z-index: 20;
      pointer-events: none;
      transition: top 0.75s var(--ease-cinema), opacity 0.6s var(--ease-cinema);
    }
    body.cinema-bars .hud-title {
      top: calc(6.4vh + 18px);
    }

    .hud-title h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 1.08rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-primary);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.78);
    }

    .hud-title .subtitle {
      margin-top: 6px;
      font-size: 0.66rem;
      letter-spacing: 0.23em;
      text-transform: uppercase;
      color: var(--ink-secondary);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
    }

    .hud-camera-meta {
      position: fixed;
      top: 28px;
      right: 32px;
      z-index: 20;
      text-align: right;
      pointer-events: none;
      transition: top 0.75s var(--ease-cinema), opacity 0.6s var(--ease-cinema);
    }
    body.cinema-bars .hud-camera-meta {
      top: calc(6.4vh + 20px);
    }

    .meta-line {
      font-size: 0.63rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(242, 230, 210, 0.46);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
      line-height: 1.7;
    }

    .meta-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff9c42;
      box-shadow: 0 0 8px rgba(255, 156, 66, 0.85);
      margin-right: 7px;
      vertical-align: middle;
      animation: pulseDot 2.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.42; transform: scale(0.84); }
    }

    /* Bottom Left Camera Shot Pills */
    .hud-shots {
      position: fixed;
      bottom: 26px;
      left: 32px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: bottom 0.75s var(--ease-cinema), opacity 0.6s var(--ease-cinema);
    }
    body.cinema-bars .hud-shots {
      bottom: calc(6.4vh + 18px);
    }

    .shot-pill {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 236, 204, 0.13);
      background: rgba(10, 13, 22, 0.44);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(240, 230, 214, 0.68);
      font-size: 0.64rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .shot-pill:hover {
      background: var(--glass-hover);
      color: var(--ink-primary);
      border-color: rgba(255, 216, 158, 0.35);
    }

    .shot-pill.active {
      color: var(--accent-gold);
      border-color: var(--glass-active-border);
      background: rgba(28, 24, 22, 0.62);
    }

    /* Bottom Right Control Dock */
    .hud-controls {
      position: fixed;
      bottom: 26px;
      right: 32px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: bottom 0.75s var(--ease-cinema), opacity 0.6s var(--ease-cinema);
    }
    body.cinema-bars .hud-controls {
      bottom: calc(6.4vh + 18px);
    }

    .hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink-primary);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease, color 0.25s ease;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
    }

    .hud-btn:hover {
      background: var(--glass-hover);
      border-color: rgba(255, 218, 160, 0.42);
      transform: translateY(-1px);
    }

    .hud-btn:active {
      transform: translateY(0);
    }

    .hud-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .hud-btn.active {
      border-color: var(--glass-active-border);
      color: var(--accent-gold);
    }

    .hud-btn.icon-only {
      padding: 8px 10px;
    }

    .hud-footer-hint {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(235, 224, 206, 0.3);
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.6s ease;
    }

    /* Subtle floating HUD restore trigger when hidden */
    #btn-restore-hud {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    body.hud-hidden #btn-restore-hud {
      opacity: 0.55;
      pointer-events: auto;
    }
    body.hud-hidden #btn-restore-hud:hover {
      opacity: 1;
    }

    @media (max-width: 920px) {
      .hud-shots { display: none; }
      .hud-camera-meta { display: none; }
      .hud-footer-hint { display: none; }
    }

    @media (max-width: 640px) {
      .hud-title { top: 16px; left: 16px; }
      .hud-title h1 { font-size: 0.85rem; }
      .hud-controls { bottom: 16px; right: 14px; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .hud-btn { padding: 7px 11px; font-size: 0.62rem; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
</head>
<body class="cinema-bars">
  <!-- Loading Curtain -->
  <div id="loading-curtain">
    <div class="loader-emblem"></div>
    <div class="loader-title">Boudha Rooftop</div>
    <div class="loader-sub">Sculpting Kathmandu Valley &middot; Procedural Lighting</div>
  </div>

  <!-- WebGL Viewport -->
  <div id="canvas-container"></div>

  <!-- Cinema Letterbox Bars -->
  <div class="letterbox top"></div>
  <div class="letterbox bottom"></div>

  <!-- Top Left Poetic Title -->
  <header class="hud-title hud-layer">
    <h1>Boudha Rooftop</h1>
    <div class="subtitle">Kathmandu Valley &middot; 27.7215&deg; N, 85.3620&deg; E</div>
  </header>

  <!-- Top Right Film Still Metadata -->
  <aside class="hud-camera-meta hud-layer">
    <div class="meta-line"><span class="meta-dot"></span><span id="meta-mood">NIGHT &middot; MOONLIT HAZE</span></div>
    <div class="meta-line">40MM ANAMORPHIC &middot; F/2.0 &middot; 35MM GRADE</div>
  </aside>

  <!-- Bottom Left Curated Film-Still Camera Presets -->
  <nav class="hud-shots hud-layer" aria-label="Camera Framings">
    <button class="shot-pill active" data-shot="orbit">01 Orbit</button>
    <button class="shot-pill" data-shot="terrace">02 Terrace</button>
    <button class="shot-pill" data-shot="chiya">03 Chiya</button>
    <button class="shot-pill" data-shot="stupa">04 Boudha</button>
    <button class="shot-pill" data-shot="flags">05 Lungta</button>
  </nav>

  <!-- Bottom Right Controls -->
  <div class="hud-controls hud-layer">
    <button id="btn-time" class="hud-btn" title="Toggle Night / Golden-Hour Day (T)">
      <svg id="icon-moon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg id="icon-sun" viewBox="0 0 24 24" style="display:none;">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
      <span id="label-time">Night</span>
    </button>

    <button id="btn-wind" class="hud-btn active" title="Cycle Himalayan Breeze (W)">
      <svg viewBox="0 0 24 24">
        <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
      </svg>

    <button id="btn-audio" class="hud-btn" title="Toggle Procedural Kathmandu Soundscape (M)">
      <svg id="icon-audio-off" viewBox="0 0 24 24">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>

      <svg id="icon-audio-on" viewBox="0 0 24 24" style="display:none;">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>

    <button id="btn-orbit" class="hud-btn active" title="Pause / Resume Cinematic Orbit (Space)">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <polygon id="orbit-play-icon" points="10 8 16 12 10 16 10 8" style="display:none; fill:currentColor;"></polygon>
        <g id="orbit-pause-icon">
          <line x1="10" y1="9" x2="10" y2="15"></line>

        </g>

    <button id="btn-bars" class="hud-btn active icon-only" title="Toggle 2.39:1 Cinema Letterbox (B)">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
        <line x1="2" y1="8.5" x2="22" y2="8.5"></line>
        <line x1="2" y1="15.5" x2="22" y2="15.5"></line>
      </svg>

    <button id="btn-hide-hud" class="hud-btn icon-only" title="Clean Film Still Mode (H)">
      <svg viewBox="0 0 24 24">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>

  </div>

  <div class="hud-footer-hint hud-layer">
    Drag to Explore &middot; Scroll to Zoom &middot; [T] Day/Night &middot; [Space] Orbit &middot; [H] Clean Frame
  </div>

  <button id="btn-restore-hud" class="hud-btn">Show UI</button>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    // =========================================================================
    // SECTION 01: DETERMINISTIC NOISE & MATHEMATICAL UTILITIES
    // =========================================================================
    function createRNG(seed = 277215) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    const rng = createRNG(85362042);

    function hash2(x, y) {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function valueNoise2D(x, y) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      const u = xf * xf * (3.0 - 2.0 * xf);
      const v = yf * yf * (3.0 - 2.0 * yf);
      const a = hash2(xi, yi);
      const b = hash2(xi + 1, yi);
      const c = hash2(xi, yi + 1);
      const d = hash2(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }

    function fbm2D(x, y, octaves = 5) {
      let sum = 0.0;
      let amp = 0.5;
      let freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        sum += amp * valueNoise2D(x * freq, y * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return sum;
    }

    function ridgedFbm2D(x, y, octaves = 5) {
      let sum = 0.0;
      let amp = 0.55;
      let freq = 1.0;
      let weight = 1.0;
      for (let i = 0; i < octaves; i++) {
        let n = valueNoise2D(x * freq, y * freq);
        n = 1.0 - Math.abs(n * 2.0 - 1.0);
        n *= n * weight;
        weight = Math.min(1.0, Math.max(0.0, n * 1.8));
        sum += n * amp;
        freq *= 2.12;
        amp *= 0.48;
      }
      return sum;
    }

    function clamp01(v) {
      return Math.max(0, Math.min(1, v));
    }

    function smoothstep(edge0, edge1, x) {
      const t = clamp01((x - edge0) / (edge1 - edge0));
      return t * t * (3 - 2 * t);
    }

    // =========================================================================
    // SECTION 02: WEBGL RENDERER, SCENE, CAMERA & CINEMATIC POST-PROCESSING
    // =========================================================================
    const container = document.getElementById('canvas-container');

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      stencil: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Three-phase atmospheric palette: Night -> Himalayan Dusk -> Golden-Hour Day
    const NIGHT_FOG_COLOR = new THREE.Color('#0a1020');
    const DUSK_FOG_COLOR  = new THREE.Color('#3b283f');
    const DAY_FOG_COLOR   = new THREE.Color('#d8b08a');

    const NIGHT_FOG_DENSITY = 0.0056;
    const DUSK_FOG_DENSITY  = 0.0050;
    const DAY_FOG_DENSITY   = 0.0040;

    scene.fog = new THREE.FogExp2(NIGHT_FOG_COLOR.getHex(), NIGHT_FOG_DENSITY);

    const camera = new THREE.PerspectiveCamera(39, window.innerWidth / window.innerHeight, 0.12, 820);
    camera.position.set(-4.35, 2.28, 5.15);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(1.55, 2.35, -14.5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.052;
    controls.maxPolarAngle = Math.PI * 0.515;
    controls.minPolarAngle = Math.PI * 0.14;
    controls.minDistance = 2.4;
    controls.maxDistance = 24.0;
    controls.enablePan = false;
    controls.update();

    // Post-Processing Pipeline: Render -> Soft Optical Bloom -> ACES Output -> 35mm Anamorphic Grade
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.54, // strength
      0.76, // radius
      0.72  // threshold
    );
    composer.addPass(bloomPass);

    const outputPass = new OutputPass();
    composer.addPass(outputPass);

    const AnamorphicFilmPass = {
      uniforms: {
        tDiffuse: { value: null },
        uTime: { value: 0 },
        uDayFactor: { value: 0 },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform float uDayFactor;
        uniform vec2 uResolution;
        varying vec2 vUv;

        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }

        void main() {
          vec2 center = vUv - 0.5;
          float dist2 = dot(center, center);

          // Microscopic vintage Cooke anamorphic edge dispersion
          vec2 caOffset = center * dist2 * 0.0042;
          float r = texture2D(tDiffuse, vUv + caOffset).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - caOffset).b;
          vec3 col = vec3(r, g, b);

          // Delicate horizontal anamorphic highlight streak / halation kiss
          vec2 texel = vec2(1.0 / max(uResolution.x, 1.0), 0.0);
          vec3 streak = vec3(0.0);
          for (int i = -4; i <= 4; i++) {
            float fi = float(i);
            vec3 s = texture2D(tDiffuse, vUv + texel * fi * 5.2).rgb;
            float bright = max(0.0, dot(s, vec3(0.33, 0.5, 0.17)) - 0.84);
            float w = exp(-abs(fi) * 0.42);
            streak += s * bright * w;
          }
          vec3 flareTint = mix(vec3(1.05, 0.86, 0.62), vec3(1.12, 0.92, 0.68), uDayFactor);
          col += streak * flareTint * mix(0.068, 0.032, uDayFactor);

          // Kodak Vision3 500T (Night) -> Kodak Portra 400 (Golden Day) inspired split-toning
          float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
          float dusk = sin(uDayFactor * 3.14159);

          vec3 nightShadow = vec3(0.92, 0.97, 1.08);
          vec3 duskShadow  = vec3(1.02, 0.92, 1.08);
          vec3 dayShadow   = vec3(0.96, 0.97, 1.03);
          vec3 shadowTint = mix(nightShadow, dayShadow, uDayFactor);
          shadowTint = mix(shadowTint, duskShadow, dusk * 0.45);

          vec3 nightHigh = vec3(1.05, 1.00, 0.94);
          vec3 dayHigh   = vec3(1.06, 1.01, 0.92);
          vec3 highTint  = mix(nightHigh, dayHigh, uDayFactor);

          col *= mix(shadowTint, highTint, smoothstep(0.06, 0.76, luma));

          // Gentle filmic toe & shoulder S-curve
          vec3 scurve = col * col * (3.0 - 2.0 * col);
          col = mix(col, scurve, 0.16);

          // Subtle shadow lift so deepest blacks feel like rich 35mm print rather than digital #000
          col = mix(vec3(0.012, 0.014, 0.022) * (1.0 - uDayFactor * 0.6), vec3(1.0), col);

          // Natural optical lens vignette
          vec2 vigPos = center * vec2(1.22, 1.02);
          float vig = smoothstep(0.95, 0.20, dot(vigPos, vigPos));
          col *= mix(0.64, 1.0, vig);

          // Fine organic 35mm celluloid film grain (weighted slightly more in mid-shadows)
          float n1 = hash12(gl_FragCoord.xy + fract(uTime * 23.71) * 140.0);
          float n2 = hash12(gl_FragCoord.xy * 0.5 + fract(uTime * 11.13) * 90.0);
          float grain = ((n1 + n2) * 0.5 - 0.5);
          float grainStrength = mix(0.028, 0.016, uDayFactor);
          col += grain * grainStrength * (0.35 + 0.65 * (1.0 - luma));

          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
      `
    };

    const filmPass = new ShaderPass(AnamorphicFilmPass);
    composer.addPass(filmPass);

    // =========================================================================
    // SECTION 03: SHARED GLOBAL SHADER UNIFORMS
    // =========================================================================
    const sharedUniforms = {
      uTime: { value: 0 },
      uDayFactor: { value: 0 },
      uFogColor: { value: NIGHT_FOG_COLOR.clone() },
      uFogDensity: { value: NIGHT_FOG_DENSITY },
      uSunDir: { value: new THREE.Vector3(-0.74, 0.21, -0.64).normalize() },
      uMoonDir: { value: new THREE.Vector3(-0.48, 0.45, -0.75).normalize() },
      uWindStrength: { value: 1.0 }
    };

    // =========================================================================
    // SECTION 04: PROCEDURAL PMREM ENVIRONMENT MAPS (Real Metallic & Wet Speculars)
    // =========================================================================
    function createProceduralEnvTexture(isDay) {
      const w = 512, h = 256;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, h);
      if (isDay) {
        grad.addColorStop(0.00, '#1f4f8e');
        grad.addColorStop(0.32, '#628db4');
        grad.addColorStop(0.49, '#f2b880');
        grad.addColorStop(0.54, '#c78c5e');
        grad.addColorStop(0.75, '#4b3b30');
        grad.addColorStop(1.00, '#241c17');
      } else {
        grad.addColorStop(0.00, '#070d1e');
        grad.addColorStop(0.30, '#121d38');
        grad.addColorStop(0.48, '#2b2538');
        grad.addColorStop(0.53, '#3b2416');
        grad.addColorStop(0.75, '#191310');
        grad.addColorStop(1.00, '#0b0908');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Key light highlight disk (Moon or Golden Sun)
      const lx = isDay ? w * 0.28 : w * 0.34;
      const ly = isDay ? h * 0.39 : h * 0.28;
      const lr = isDay ? 54 : 38;
      const lg = ctx.createRadialGradient(lx, ly, 2, lx, ly, lr);
      if (isDay) {
        lg.addColorStop(0, 'rgba(255, 240, 200, 1.0)');
        lg.addColorStop(0.4, 'rgba(255, 185, 110, 0.65)');
        lg.addColorStop(1, 'rgba(255, 160, 80, 0.0)');
      } else {
        lg.addColorStop(0, 'rgba(215, 232, 255, 0.95)');
        lg.addColorStop(0.4, 'rgba(130, 165, 225, 0.4)');
        lg.addColorStop(1, 'rgba(70, 100, 160, 0.0)');
      }
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.arc(lx, ly, lr, 0, Math.PI * 2);
      ctx.fill();

      // Warm amber rooftop & Boudhanath specular bounce lobes at night
      if (!isDay) {
        const lobes = [
          [w * 0.52, h * 0.51, 44, 'rgba(255, 175, 82, 0.55)'],
          [w * 0.78, h * 0.55, 36, 'rgba(255, 138, 48, 0.50)'],
          [w * 0.16, h * 0.54, 30, 'rgba(255, 152, 62, 0.42)']
        ];
        for (const [bx, by, br, col] of lobes) {
          const g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
          g.addColorStop(0, col);
          g.addColorStop(1, 'rgba(255, 120, 30, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(bx, by, br, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const eqTex = new THREE.CanvasTexture(c);
      eqTex.mapping = THREE.EquirectangularReflectionMapping;
      eqTex.colorSpace = THREE.SRGBColorSpace;
      return eqTex;
    }

    const pmremGen = new THREE.PMREMGenerator(renderer);
    pmremGen.compileEquirectangularShader();
    const envNightRT = pmremGen.fromEquirectangular(createProceduralEnvTexture(false));
    const envDayRT   = pmremGen.fromEquirectangular(createProceduralEnvTexture(true));
    scene.environment = envNightRT.texture;
    let activeEnvIsDay = false;

    // =========================================================================
    // SECTION 05: HIGH-RESOLUTION PROCEDURAL CANVAS TEXTURE ATELIER
    // =========================================================================

    // 5.1 Soft Radial Glow & Smoke Sprite
    function createSoftRadialTexture(falloff = 2.0) {
      const s = 128;
      const c = document.createElement('canvas');
      c.width = s; c.height = s;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(s, s);
      for (let y = 0; y < s; y++) {
        for (let x = 0; x < s; x++) {
          const dx = (x + 0.5) / s * 2 - 1;
          const dy = (y + 0.5) / s * 2 - 1;
          const d = Math.sqrt(dx * dx + dy * dy);
          const a = Math.pow(clamp01(1.0 - d), falloff);
          const idx = (y * s + x) * 4;
          img.data[idx]     = 255;
          img.data[idx + 1] = 255;
          img.data[idx + 2] = 255;
          img.data[idx + 3] = Math.floor(a * 255);
        }
      }
      ctx.putImageData(img, 0, 0);
      return new THREE.CanvasTexture(c);
    }

    const softGlowTex = createSoftRadialTexture(2.2);
    const softMistTex = createSoftRadialTexture(1.55);

    // 5.2 Damp Weathered Kathmandu Terracotta & Slate Rooftop Pavers (1024x1024 PBR set)
    function createRooftopTilePBR() {
      const size = 1024;
      const cCol = document.createElement('canvas');
      const cBmp = document.createElement('canvas');
      const cRgh = document.createElement('canvas');
      cCol.width = cBmp.width = cRgh.width = size;
      cCol.height = cBmp.height = cRgh.height = size;

      const ctxC = cCol.getContext('2d');
      const ctxB = cBmp.getContext('2d');
      const ctxR = cRgh.getContext('2d');
      const r = createRNG(1001);

      // Aged mortar grout background
      ctxC.fillStyle = '#3b3530';
      ctxC.fillRect(0, 0, size, size);
      ctxB.fillStyle = '#363636';
      ctxB.fillRect(0, 0, size, size);
      ctxR.fillStyle = '#e0e0e0';
      ctxR.fillRect(0, 0, size, size);

      const grid = 10;
      const tile = size / grid;

      for (let gy = 0; gy < grid; gy++) {
        for (let gx = 0; gx < grid; gx++) {
          const x = gx * tile;
          const y = gy * tile;
          const v = r();
          const redBias = r() > 0.3 ? 1 : 0.72;
          const cr = Math.floor((116 + v * 34) * redBias);
          const cg = Math.floor((82 + v * 26) * (0.85 + r() * 0.15));
          const cb = Math.floor((68 + v * 22) * (0.85 + r() * 0.15));

          // Slightly uneven tile chamfer
          const pad = 3;
          ctxC.fillStyle = `rgb(${cr},${cg},${cb})`;
          ctxC.fillRect(x + pad, y + pad, tile - pad * 2, tile - pad * 2);

          // Inner subtle tile gradient
          const tg = ctxC.createLinearGradient(x, y, x + tile, y + tile);
          tg.addColorStop(0, 'rgba(255,240,220,0.06)');
          tg.addColorStop(1, 'rgba(15,10,8,0.12)');
          ctxC.fillStyle = tg;
          ctxC.fillRect(x + pad, y + pad, tile - pad * 2, tile - pad * 2);

          // Subtle hairline crack on occasional tiles
          if (r() > 0.78) {
            ctxC.strokeStyle = 'rgba(25,20,18,0.34)';
            ctxC.lineWidth = 1.5;
            ctxC.beginPath();
            ctxC.moveTo(x + pad + r() * tile * 0.4, y + pad);
            ctxC.lineTo(x + tile * 0.5 + (r() - 0.5) * 18, y + tile * 0.5);
            ctxC.lineTo(x + tile * 0.3 + r() * tile * 0.5, y + tile - pad);
            ctxC.stroke();
          }

          const bv = Math.floor(170 + r() * 48);
          ctxB.fillStyle = `rgb(${bv},${bv},${bv})`;
          ctxB.fillRect(x + pad, y + pad, tile - pad * 2, tile - pad * 2);

          const rv = Math.floor(165 + r() * 55);
          ctxR.fillStyle = `rgb(${rv},${rv},${rv})`;
          ctxR.fillRect(x + pad, y + pad, tile - pad * 2, tile - pad * 2);
        }
      }

      // Monsoon moss & soot weathering near mortar joints
      for (let i = 0; i < 900; i++) {
        const px = r() * size;
        const py = r() * size;
        const rad = 6 + r() * 44;
        const type = r();
        const grad = ctxC.createRadialGradient(px, py, 0, px, py, rad);
        if (type < 0.55) {
          grad.addColorStop(0, 'rgba(24, 20, 18, 0.16)');
        } else if (type < 0.78) {
          grad.addColorStop(0, 'rgba(42, 54, 34, 0.14)'); // Subtle monsoon moss
        } else {
          grad.addColorStop(0, 'rgba(182, 162, 140, 0.08)');
        }
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctxC.fillStyle = grad;
        ctxC.beginPath();
        ctxC.arc(px, py, rad, 0, Math.PI * 2);
        ctxC.fill();
      }

      // Evening dew / damp rainwater puddles (darker albedo + glossy low roughness so lanterns reflect!)
      for (let i = 0; i < 14; i++) {
        const px = r() * size;
        const py = r() * size;
        const rx = 38 + r() * 88;
        const ry = 28 + r() * 72;

        ctxC.save();
        ctxC.translate(px, py);
        ctxC.scale(1, ry / rx);
        const cg = ctxC.createRadialGradient(0, 0, rx * 0.1, 0, 0, rx);
        cg.addColorStop(0, 'rgba(16, 14, 14, 0.28)');
        cg.addColorStop(0.75, 'rgba(18, 16, 16, 0.12)');
        cg.addColorStop(1, 'rgba(18, 16, 16, 0.0)');
        ctxC.fillStyle = cg;
        ctxC.beginPath();
        ctxC.arc(0, 0, rx, 0, Math.PI * 2);
        ctxC.fill();
        ctxC.restore();

        ctxR.save();
        ctxR.translate(px, py);
        ctxR.scale(1, ry / rx);
        const rg = ctxR.createRadialGradient(0, 0, rx * 0.15, 0, 0, rx);
        rg.addColorStop(0, 'rgba(26, 26, 26, 0.92)'); // Very glossy wet puddle
        rg.addColorStop(0.65, 'rgba(48, 48, 48, 0.55)');
        rg.addColorStop(1, 'rgba(48, 48, 48, 0.0)');
        ctxR.fillStyle = rg;
        ctxR.beginPath();
        ctxR.arc(0, 0, rx, 0, Math.PI * 2);
        ctxR.fill();
        ctxR.restore();
      }

      const wrap = (canvas, isSRGB) => {
        const t = new THREE.CanvasTexture(canvas);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(3.8, 3.4);
        t.anisotropy = 8;
        if (isSRGB) t.colorSpace = THREE.SRGBColorSpace;
        return t;
      };

      return {
        map: wrap(cCol, true),
        bumpMap: wrap(cBmp, false),
        roughnessMap: wrap(cRgh, false)
      };
    }

    // 5.3 Peeling Lime Plaster & Traditional Nepali Red Brick (1024x1024)
    function createPlasterBrickPBR() {
      const size = 1024;
      const cCol = document.createElement('canvas');
      const cBmp = document.createElement('canvas');
      cCol.width = cBmp.width = size;
      cCol.height = cBmp.height = size;
      const ctxC = cCol.getContext('2d');
      const ctxB = cBmp.getContext('2d');
      const r = createRNG(1002);

      // Aged ochre-cream stucco plaster
      ctxC.fillStyle = '#9f8d77';
      ctxC.fillRect(0, 0, size, size);
      ctxB.fillStyle = '#b4b4b4';
      ctxB.fillRect(0, 0, size, size);

      // Hand-troweled texture variation
      for (let i = 0; i < 1400; i++) {
        const x = r() * size, y = r() * size, rad = 8 + r() * 44;
        ctxC.fillStyle = r() > 0.5 ? 'rgba(64, 48, 36, 0.065)' : 'rgba(226, 210, 186, 0.06)';
        ctxC.beginPath();
        ctxC.arc(x, y, rad, 0, Math.PI * 2);
        ctxC.fill();

        ctxB.fillStyle = r() > 0.5 ? 'rgba(90,90,90,0.08)' : 'rgba(210,210,210,0.08)';
        ctxB.beginPath();
        ctxB.arc(x, y, rad * 0.7, 0, Math.PI * 2);
        ctxB.fill();
      }

      // Exposed patches of authentic thin Nepali fired red brick (Dachi Appa)
      const rows = 28, cols = 12;
      const bh = size / rows, bw = size / cols;
      for (let p = 0; p < 7; p++) {
        const px = r() * size, py = r() * size;
        const pr = 55 + r() * 95;
        ctxC.save();
        ctxB.save();

        // Organic irregular jagged plaster peel polygon
        const path = new Path2D();
        const verts = 14;
        for (let k = 0; k < verts; k++) {
          const a = (k / verts) * Math.PI * 2;
          const rad = pr * (0.7 + r() * 0.48);
          const vx = px + Math.cos(a) * rad;
          const vy = py + Math.sin(a) * rad;
          if (k === 0) path.moveTo(vx, vy); else path.lineTo(vx, vy);
        }
        path.closePath();

        // Plaster lip shadow
        ctxC.strokeStyle = 'rgba(34, 24, 18, 0.48)';
        ctxC.lineWidth = 7;
        ctxC.stroke(path);

        ctxC.clip(path);
        ctxB.clip(path);

        ctxC.fillStyle = '#52463d';
        ctxC.fillRect(0, 0, size, size);
        ctxB.fillStyle = '#383838';
        ctxB.fillRect(0, 0, size, size);

        for (let row = 0; row < rows; row++) {
          const off = (row % 2) * (bw * 0.5);
          for (let col = -1; col <= cols; col++) {
            const bx = col * bw + off;
            const by = row * bh;
            const br = Math.floor(134 + r() * 38);
            const bg = Math.floor(58 + r() * 22);
            const bb = Math.floor(42 + r() * 16);
            ctxC.fillStyle = `rgb(${br},${bg},${bb})`;
            ctxC.fillRect(bx + 2, by + 2, bw - 4, bh - 4);
            ctxB.fillStyle = '#929292';
            ctxB.fillRect(bx + 2, by + 2, bw - 4, bh - 4);
          }
        }
        ctxC.restore();
        ctxB.restore();
      }

      // Rainwater drip streaks down from coping stone
      for (let i = 0; i < 85; i++) {
        const x = r() * size;
        const h = 80 + r() * 480;
        const w = 3 + r() * 14;
        const g = ctxC.createLinearGradient(x, 0, x, h);
        g.addColorStop(0, 'rgba(32, 28, 22, 0.34)');
        g.addColorStop(0.5, 'rgba(42, 48, 30, 0.14)');
        g.addColorStop(1, 'rgba(32, 28, 22, 0)');
        ctxC.fillStyle = g;
        ctxC.fillRect(x, 0, w, h);
      }

      const map = new THREE.CanvasTexture(cCol);
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(3.2, 1.0);
      map.anisotropy = 8;
      map.colorSpace = THREE.SRGBColorSpace;

      const bumpMap = new THREE.CanvasTexture(cBmp);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(3.2, 1.0);

      return { map, bumpMap };
    }

    // 5.4 Dark Aged Newari Carved Sal Wood Texture (512x512)
    function createCarvedWoodPBR() {
      const s = 512;

        ctxC.fillRect(0, y, s, 1 + r() * 2.5);

        ctxB.beginPath(); ctxB.moveTo(0, by); ctxB.lineTo(s, by); ctxB.stroke();
      }

      const map = new THREE.CanvasTexture(cCol);

    }

    // 5.5 Traditional Nepali Terracotta Jhingati Roof Tile Shingle Texture
    function createJhingatiTilePBR() {
      const s = 512;
      const cCol = document.createElement('canvas');
      const cBmp = document.createElement('canvas');
      cCol.width = cBmp.width = s;
      cCol.height = cBmp.height = s;
      const ctxC = cCol.getContext('2d');
      const ctxB = cBmp.getContext('2d');

      ctxC.fillStyle = '#381c14';

          const tg = ctxC.createLinearGradient(x, y, x + rw, y + rh);

          ctxC.fillStyle = tg;

          ctxC.roundRect(x + 2, y + 1, rw - 4, rh + 6, [2, 2, 10, 10]);

          if (r() > 0.72) {

          const bg = ctxB.createLinearGradient(x, y, x, y + rh);

          ctxB.beginPath();
          ctxB.roundRect(x + 2, y + 1, rw - 4, rh + 4, [2, 2, 10, 10]);

      }

      const map = new THREE.CanvasTexture(cCol);

      map.colorSpace = THREE.SRGBColorSpace;
      const bumpMap = new THREE.CanvasTexture(cBmp);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(2.5, 2.2);
      return { map, bumpMap };
    }

    // 5.6 Hand-Woven Tibetan Wool Rug Texture (Key-Fret Border & Medallion)
    function createTibetanRugTexture() {
      const s = 512;
      const c = document.createElement('canvas');
      c.width = s; c.height = s;
      const ctx = c.getContext('2d');
      const r = createRNG(1005);

      // Deep madder crimson base
      ctx.fillStyle = '#5e1c1a';
      ctx.fillRect(0, 0, s, s);

      // Outer indigo & gold key-fret border
      ctx.strokeStyle = '#1e2f4d';
      ctx.lineWidth = 42;
      ctx.strokeRect(21, 21, s - 42, s - 42);

      ctx.strokeStyle = '#c89236';
      ctx.lineWidth = 8;
      ctx.strokeRect(48, 48, s - 96, s - 96);
      ctx.strokeRect(62, 62, s - 124, s - 124);

      // Geometric Tibetan meander ticks around border
      ctx.fillStyle = '#d4a246';
      for (let i = 52; i < s - 52; i += 24) {
        ctx.fillRect(i, 16, 12, 10);
        ctx.fillRect(i, s - 26, 12, 10);
        ctx.fillRect(16, i, 10, 12);
        ctx.fillRect(s - 26, i, 10, 12);
      }

      // Central lotus medallion
      ctx.save();
      ctx.translate(s / 2, s / 2);
      ctx.fillStyle = '#203252';
      ctx.beginPath();
      ctx.arc(0, 0, 118, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < 12; i++) {
        ctx.rotate((Math.PI * 2) / 12);
        ctx.fillStyle = i % 2 === 0 ? '#cc8e32' : '#d8c49e';
        ctx.beginPath();
        ctx.ellipse(0, -68, 18, 36, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#7c241e';
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e0b048';
      ctx.beginPath();

    // 5.7 Nepali Woven Dhaka Cushion Pattern Texture
    function createDhakaFabricTexture(primary, accent) {
      const s = 256;
      const c = document.createElement('canvas');
      c.width = s; c.height = s;
      const ctx = c.getContext('2d');

      ctx.fillStyle = primary;
      ctx.fillRect(0, 0, s, s);

      // Traditional geometric diamond-weave Dhaka bands
      const step = 32;
      for (let y = 0; y < s; y += step) {
        for (let x = 0; x < s; x += step) {
          ctx.fillStyle = accent;
          ctx.beginPath();
          ctx.moveTo(x + step / 2, y + 3);
          ctx.lineTo(x + step - 3, y + step / 2);
          ctx.lineTo(x + step / 2, y + step - 3);
          ctx.lineTo(x + 3, y + step / 2);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#e8d8b8';
          ctx.beginPath();
          ctx.moveTo(x + step / 2, y + 10);
          ctx.lineTo(x + step - 10, y + step / 2);
          ctx.lineTo(x + step / 2, y + step - 10);
          ctx.lineTo(x + 10, y + step / 2);
          ctx.closePath();
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.arc(cx, crownY + 34, pw * 0.47, 0.10, Math.PI - 0.10);
        ctx.stroke();

        // Delicate saffron drips cascading naturally down the chalk dome
        for (let d = 0; d < 2; d++) {
          const dx = cx + (d - 0.5) * pw * 0.24;

          dg.addColorStop(0, 'rgba(210, 146, 40, 0.38)');

    // 5.13 Detailed Kathmandu Neighborhood Building Facade Atlas (Diffuse + Emissive)
    function createCityBuildingTextures(seedOffset, style) {
      const w = 512, h = 1024;
      const cDiff = document.createElement('canvas');
      const cEmis = document.createElement('canvas');
      cDiff.width = cEmis.width = w;
      cDiff.height = cEmis.height = h;
      const ctxD = cDiff.getContext('2d');
      const ctxE = cEmis.getContext('2d');
      const r = createRNG(2100 + seedOffset);

      ctxD.fillStyle = style.baseColor;
      ctxD.fillRect(0, 0, w, h);
      ctxE.fillStyle = '#000000';
      ctxE.fillRect(0, 0, w, h);

      // Plaster weathering & monsoon drip grime
      for (let i = 0; i < 340; i++) {
        ctxD.fillStyle = r() > 0.5 ? 'rgba(18, 14, 12, 0.08)' : 'rgba(244, 232, 212, 0.05)';
        ctxD.fillRect(r() * w, r() * h, 14 + r() * 68, 20 + r() * 90);
      }

      // Traditional Tibetan monastery crimson roof-band (Khem) if monastery style
      if (style.isMonastery) {
        ctxD.fillStyle = '#6c1d18';
        ctxD.fillRect(0, 0, w, 96);
        ctxD.fillStyle = '#d49a38';
        ctxD.fillRect(0, 88, w, 12);
        for (let i = 0; i < 8; i++) {
          ctxD.fillStyle = '#dfb04c';
          ctxD.beginPath();
          ctxD.arc(32 + i * 64, 48, 14, 0, Math.PI * 2);
          ctxD.fill();
        }
      }

      const floors = style.floors;
      const fh = h / floors;
      const cols = style.cols;
      const cw = w / cols;

      for (let f = 0; f < floors; f++) {
        const fy = f * fh;

        // Floor slab ledge & balcony shadow
        ctxD.fillStyle = 'rgba(26, 22, 20, 0.34)';
        ctxD.fillRect(0, fy, w, 10);
        ctxD.fillStyle = 'rgba(220, 206, 186, 0.14)';
        ctxD.fillRect(0, fy + 10, w, 5);

        const isGroundShop = (f === floors - 1);

        for (let col = 0; col < cols; col++) {
          const wx = col * cw + cw * 0.16;
          const wy = fy + fh * (isGroundShop ? 0.18 : 0.22);
          const ww = cw * 0.68;
          const wh = fh * (isGroundShop ? 0.72 : 0.56);

          // Traditional dark carved wooden window trim (or painted Nepali blue/green trim)
          ctxD.fillStyle = style.trimColor;
          ctxD.fillRect(wx - 7, wy - 7, ww + 14, wh + 14);

          // Recessed window glass
          ctxD.fillStyle = '#12151e';
          ctxD.fillRect(wx, wy, ww, wh);

          // Decide illumination probability (warm street-level shops glow brightly!)
          const litProb = isGroundShop ? 0.68 : 0.44;
          if (r() < litProb) {
            const isCool = !isGroundShop && r() < 0.15;
            const g = ctxE.createLinearGradient(wx, wy, wx, wy + wh);
            if (isCool) {
              g.addColorStop(0, '#c6deff');
              g.addColorStop(1, '#4c6d9c');
            } else if (isGroundShop) {
              g.addColorStop(0, '#ffd48c');
              g.addColorStop(0.6, '#f09432');
              g.addColorStop(1, '#a84a12');
            } else {
              const warmth = r();
              g.addColorStop(0, warmth > 0.45 ? '#ffd488' : '#ffad54');
              g.addColorStop(1, warmth > 0.45 ? '#b8621c' : '#80340e');
            }
            ctxE.fillStyle = g;
            ctxE.fillRect(wx + 2, wy + 2, ww - 4, wh - 4);

            // Window mullions / carved Newari lattice bars
            ctxE.fillStyle = '#140e0a';
            ctxE.fillRect(wx + ww * 0.5 - 2, wy, 4, wh);
            ctxE.fillRect(wx, wy + wh * 0.52, ww, 3.5);
            if (style.isNewari) {
              ctxE.fillRect(wx + ww * 0.25 - 1.5, wy, 3, wh);
              ctxE.fillRect(wx + ww * 0.75 - 1.5, wy, 3, wh);
            }

            // Interior curtain or person/furniture silhouette depth
            if (r() > 0.48) {
              ctxE.fillStyle = 'rgba(18, 10, 6, 0.52)';
              const cwCurtain = ww * (0.25 + r() * 0.28);
              if (r() > 0.5) {
                ctxE.fillRect(wx, wy, cwCurtain, wh);
              } else {
                ctxE.fillRect(wx + ww - cwCurtain, wy, cwCurtain, wh);
              }
            }
          }
        }
      }

      const map = new THREE.CanvasTexture(cDiff);
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;

      const emissiveMap = new THREE.CanvasTexture(cEmis);

    // =========================================================================
    // SECTION 06: PROCEDURAL HIMALAYAN SKY DOME SHADER
    // (Milky Way Dust, Twinkling Stars, Crescent Moon, Dusk Transition, Golden Sun, Clouds)
    // =========================================================================
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        uTime: sharedUniforms.uTime,
        uDayFactor: sharedUniforms.uDayFactor,
        uSunDir: sharedUniforms.uSunDir,
        uMoonDir: sharedUniforms.uMoonDir
      },
      vertexShader: /* glsl */`
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime;
        uniform float uDayFactor;
        uniform vec3 uSunDir;
        uniform vec3 uMoonDir;
        varying vec3 vDir;

        float hash31(vec3 p) {
          p = fract(p * vec3(443.8975, 397.2973, 491.1871));
          p += dot(p.zxy, p.yxz + 19.19);
          return fract(p.x * p.y * p.z);
        }

        float noise2(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          float a = hash31(vec3(i, 0.0));
          float b = hash31(vec3(i + vec2(1.0, 0.0), 0.0));
          float c = hash31(vec3(i + vec2(0.0, 1.0), 0.0));
          float d = hash31(vec3(i + vec2(1.0, 1.0), 0.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 5; i++) {
            v += a * noise2(p);
            p = p * 2.04 + vec2(11.7, 8.3);
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec3 dir = normalize(vDir);
          float h = clamp(dir.y, 0.0, 1.0);
          float dusk = sin(uDayFactor * 3.14159);

          // 1. NIGHT SKY: Crisp Himalayan indigo zenith -> warm urban valley light pollution haze
          vec3 nZenith  = vec3(0.014, 0.026, 0.068);
          vec3 nMid     = vec3(0.042, 0.068, 0.138);
          vec3 nHorizon = vec3(0.145, 0.125, 0.165);
          vec3 nightCol = mix(nHorizon, nMid, smoothstep(0.0, 0.25, h));
          nightCol = mix(nightCol, nZenith, smoothstep(0.18, 0.78, h));
          // Amber Kathmandu urban haze hugging horizon
          float urbanGlow = exp(-abs(dir.y - 0.012) * 15.0);
          nightCol += vec3(0.22, 0.115, 0.048) * urbanGlow;

          // 2. DUSK INTERMEDIATE: Luminous Himalayan twilight violet & rose-amber
          vec3 kZenith  = vec3(0.08, 0.11, 0.28);
          vec3 kHorizon = vec3(0.68, 0.34, 0.28);
          vec3 duskCol  = mix(kHorizon, kZenith, smoothstep(0.0, 0.52, h));

          // 3. GOLDEN-HOUR DAY: Cerulean alpine sky -> dusty golden-peach valley horizon
          vec3 dZenith  = vec3(0.12, 0.32, 0.62);
          vec3 dMid     = vec3(0.38, 0.56, 0.74);
          vec3 dHorizon = vec3(0.95, 0.72, 0.48);
          vec3 dayCol = mix(dHorizon, dMid, smoothstep(0.0, 0.26, h));
          dayCol = mix(dayCol, dZenith, smoothstep(0.22, 0.80, h));

          vec3 col = mix(nightCol, dayCol, uDayFactor);
          col = mix(col, duskCol, dusk * 0.48);

          float nightVis = 1.0 - smoothstep(0.0, 0.58, uDayFactor);

          // SUBTLE HIMALAYAN MILKY WAY BAND (Night only)
          if (nightVis > 0.01 && dir.y > 0.06) {
            float mwBand = exp(-pow((dir.x * 0.72 + dir.z * 0.45 - dir.y * 0.58 + 0.18) * 3.6, 2.0));
            float mwCloud = fbm(dir.xz * 4.5 + vec2(2.1, -1.4));
            col += vec3(0.10, 0.13, 0.22) * mwBand * mwCloud * smoothstep(0.06, 0.35, dir.y) * nightVis * 0.55;
          }

          // MULTI-SCALE TWINKLING STARFIELD (Night only)
          if (nightVis > 0.01 && dir.y > 0.025) {
            for (int layer = 0; layer < 2; layer++) {
              float scale = layer == 0 ? 195.0 : 320.0;
              vec3 sp = dir * scale;
              vec3 cell = floor(sp);
              vec3 f = fract(sp) - 0.5;
              float rnd = hash31(cell + float(layer) * 71.0);
              float thresh = layer == 0 ? 0.968 : 0.976;
              if (rnd > thresh) {
                vec3 off = (vec3(hash31(cell + 1.3), hash31(cell + 2.7), hash31(cell + 4.1)) - 0.5) * 0.62;
                float dist = length(f - off);
                float rad = layer == 0 ? 0.115 : 0.085;
                float star = smoothstep(rad, 0.012, dist);
                float twinkle = 0.65 + 0.35 * sin(uTime * (1.6 + rnd * 5.2) + rnd * 82.0);
                vec3 sCol = mix(vec3(0.78, 0.88, 1.0), vec3(1.0, 0.90, 0.72), fract(rnd * 43.0));
                col += sCol * star * twinkle * smoothstep(0.025, 0.24, dir.y) * nightVis * (layer == 0 ? 1.45 : 0.85);
              }
            }
          }

          // WAXING CRESCENT MOON WITH EARTHSHINE & SOFT ATMOSPHERIC CORONA
          vec3 mDir = normalize(uMoonDir);
          float moonDot = max(dot(dir, mDir), 0.0);
          float moonDisk = smoothstep(0.99912, 0.99942, moonDot);
          vec3 cutDir = normalize(mDir + vec3(0.016, 0.009, 0.0));
          float moonCut = smoothstep(0.99900, 0.99932, dot(dir, cutDir));
          float crescent = clamp(moonDisk - moonCut * 0.82, 0.0, 1.0);
          float earthshine = moonDisk * 0.16;
          float moonCorona = pow(moonDot, 14.0) * 0.22 + pow(moonDot, 96.0) * 0.38;
          col += vec3(0.72, 0.84, 1.0) * moonCorona * nightVis;
          col += vec3(1.55, 1.56, 1.62) * (crescent + earthshine) * nightVis;

          // LOW GOLDEN-HOUR SUN & WARM MIE SCATTERING
          vec3 sDir = normalize(uSunDir);
          float sunDot = max(dot(dir, sDir), 0.0);
          float sunDisk = smoothstep(0.9985, 0.99925, sunDot);
          float sunHalo = pow(sunDot, 5.5) * 0.44 + pow(sunDot, 42.0) * 0.72;
          col += vec3(1.0, 0.62, 0.30) * sunHalo * clamp(uDayFactor + dusk * 0.55, 0.0, 1.0);
          col += vec3(2.6, 1.95, 1.25) * sunDisk * uDayFactor;

          // HIGH-ALTITUDE HIMALAYAN WISPY CLOUDS
          if (dir.y > 0.015) {
            vec2 cUv = dir.xz / (dir.y + 0.24) * 1.12;
            cUv.x += uTime * 0.0042;
            cUv.y -= uTime * 0.0018;
            float n = fbm(cUv * 1.38);
            float nDetail = fbm(cUv * 3.1 - vec2(uTime * 0.003, 0.0));
            float cloudMask = smoothstep(0.45, 0.78, n * 0.76 + nDetail * 0.24) * smoothstep(0.015, 0.20, dir.y);

            vec3 nCloud = mix(vec3(0.07, 0.10, 0.18), vec3(0.28, 0.34, 0.46), pow(moonDot, 3.0));
            vec3 kCloud = mix(vec3(0.32, 0.20, 0.30), vec3(0.96, 0.48, 0.28), pow(sunDot, 2.0));
            vec3 dCloud = mix(vec3(0.88, 0.80, 0.74), vec3(1.18, 0.84, 0.56), pow(sunDot, 2.2));

            vec3 cloudCol = mix(nCloud, dCloud, uDayFactor);
            cloudCol = mix(cloudCol, kCloud, dusk * 0.52);
            col = mix(col, cloudCol, cloudMask * mix(0.38, 0.64, uDayFactor));
          }

          // Smooth horizon ground blending
          vec3 horCol = mix(nHorizon, dHorizon, uDayFactor);
          horCol = mix(horCol, kHorizon, dusk * 0.48);
          col = mix(col, horCol, smoothstep(0.02, -0.08, dir.y));

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });

    // --- Bamboo Prayer Flag Poles Lashed to Parapet Corners ---
    const bambooMat = new THREE.MeshStandardMaterial({ color: '#7c6a48', roughness: 0.82 });
    const poleDefs = [
      { x: -6.86, z: -5.78, h: 5.10, tiltX: -0.03, tiltZ:  0.035 },
      { x:  6.86, z: -5.78, h: 4.72, tiltX: -0.02, tiltZ: -0.04 },

    // =========================================================================
    // SECTION 09: HERO RIPPLING TIBETAN PRAYER FLAGS (Custom Cloth Physics Shader)
    // =========================================================================
    const prayerFlagTex = createPrayerFlagTexture();

    // Sun-weathered Tibetan 5-Element Cloth Palette: Blue, White, Red, Green, Yellow
    const FLAG_PALETTE = [
      new THREE.Color('#28548d'),
      new THREE.Color('#e4dccd'),
      new THREE.Color('#b43129'),
      new THREE.Color('#2b7449'),
      new THREE.Color('#d89d28')
    ];

    function buildPrayerFlagSystem(lines, options = {}) {
      const {
        flagW = 0.34,
        flagH = 0.43,
        gap = 0.055,
        segX = 6,
        segY = 7,
        sag = 0.62,
        withRopes = true,
        waveAmp = 0.25
      } = options;

      const positions = [];
      const normals = [];
      const localUVs = [];
      const flagColors = [];
      const flagSeeds = [];
      const indices = [];

      const ropeGroup = new THREE.Group();
      const ropeMat = new THREE.MeshStandardMaterial({ color: '#4c4134', roughness: 0.96 });
      let vertexOffset = 0;

      for (const line of lines) {
        const pA = line.start;
        const pB = line.end;
        const lineSag = line.sag !== undefined ? line.sag : sag;
        const totalLen = pA.distanceTo(pB);
        const dir = new THREE.Vector3().subVectors(pB, pA).normalize();

        const curvePts = [];
        for (let i = 0; i <= 22; i++) {
          const t = i / 22;
          const pt = new THREE.Vector3().lerpVectors(pA, pB, t);
          pt.y -= Math.sin(t * Math.PI) * lineSag;
          curvePts.push(pt);
        }
        const curve = new THREE.CatmullRomCurve3(curvePts);

        if (withRopes) {
          const tube = new THREE.Mesh(
            new THREE.TubeGeometry(curve, 26, 0.011, 5, false),
            ropeMat
          );
          ropeGroup.add(tube);
        }

        const stepDist = flagW + gap;
        const count = Math.max(2, Math.floor((totalLen - 0.45) / stepDist));
        const baseNormal = new THREE.Vector3(-dir.z, 0, dir.x).normalize();

        for (let f = 0; f < count; f++) {
          const tMid = 0.025 + ((f + 0.5) / count) * 0.95;
          const t0 = Math.max(0, tMid - (flagW * 0.5) / totalLen);
          const t1 = Math.min(1, tMid + (flagW * 0.5) / totalLen);

          const topA = curve.getPoint(t0);
          const topB = curve.getPoint(t1);
          const col = FLAG_PALETTE[(f + (line.colorOffset || 0)) % 5];
          const seed = rng() * 120.0;

          for (let iy = 0; iy <= segY; iy++) {
            const v = 1.0 - iy / segY;
            for (let ix = 0; ix <= segX; ix++) {
              const u = ix / segX;
              const px = THREE.MathUtils.lerp(topA.x, topB.x, u);
              const py = THREE.MathUtils.lerp(topA.y, topB.y, u) - (1.0 - v) * flagH;
              const pz = THREE.MathUtils.lerp(topA.z, topB.z, u);

              positions.push(px, py, pz);
              normals.push(baseNormal.x, baseNormal.y, baseNormal.z);
              localUVs.push(u, v);
              flagColors.push(col.r, col.g, col.b);
              flagSeeds.push(seed);
            }
          }

          for (let iy = 0; iy < segY; iy++) {
            for (let ix = 0; ix < segX; ix++) {
              const a = vertexOffset + iy * (segX + 1) + ix;
              const b = a + 1;
              const c = a + (segX + 1);
              const d = c + 1;
              indices.push(a, c, b, b, c, d);
            }
          }
          vertexOffset += (segX + 1) * (segY + 1);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute('aLocalUV', new THREE.Float32BufferAttribute(localUVs, 2));
      geo.setAttribute('aFlagColor', new THREE.Float32BufferAttribute(flagColors, 3));
      geo.setAttribute('aFlagSeed', new THREE.Float32BufferAttribute(flagSeeds, 1));
      geo.setIndex(indices);

      const mat = new THREE.ShaderMaterial({
        side: THREE.DoubleSide,
        uniforms: {
          uTime: sharedUniforms.uTime,
          uDayFactor: sharedUniforms.uDayFactor,
          uFogColor: sharedUniforms.uFogColor,
          uFogDensity: sharedUniforms.uFogDensity,
          uSunDir: sharedUniforms.uSunDir,
          uMoonDir: sharedUniforms.uMoonDir,
          uWindStrength: sharedUniforms.uWindStrength,
          uTex: { value: prayerFlagTex },
          uWaveAmp: { value: waveAmp }
        },
        vertexShader: /* glsl */`
          attribute vec2 aLocalUV;
          attribute vec3 aFlagColor;
          attribute float aFlagSeed;

          uniform float uTime;
          uniform float uWindStrength;
          uniform float uWaveAmp;

          varying vec2 vLocalUV;
          varying vec3 vColor;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          varying float vFogDepth;

          void main() {
            vLocalUV = aLocalUV;
            vColor = aFlagColor;

            vec3 pos = position;
            float pin = pow(1.0 - aLocalUV.y, 1.32);

            // Prevailing Kathmandu valley breeze blowing across the terrace
            vec3 windDir = normalize(vec3(0.76, 0.14, -0.63));
            float wPow = uWindStrength;

            // Layered wind gusts + high-frequency trailing-edge whip
            float gustEnvelope = 0.58 + 0.42 * sin(uTime * 0.78 + pos.x * 0.16 + pos.z * 0.12);
            float microGust    = 0.80 + 0.20 * sin(uTime * 2.15 - pos.x * 0.35 + aFlagSeed * 0.2);
            float gust = gustEnvelope * microGust * wPow;

            float wave1 = sin(pos.x * 0.62 + pos.z * 0.42 - uTime * (2.6 + wPow * 0.8) + aFlagSeed * 0.3);
            float wave2 = sin(aLocalUV.y * 6.2 - uTime * (5.8 + wPow * 2.2) + aFlagSeed * 2.1 + aLocalUV.x * 2.6);
            float wave3 = cos(aLocalUV.x * 8.0 - uTime * (8.5 + wPow * 3.0) + aFlagSeed * 4.7);

            float disp = (wave1 * 0.55 + wave2 * 0.31 + wave3 * 0.14) * uWaveAmp * gust * pin;
            float steadyBlow = 0.56 * uWaveAmp * gust * pin;

            pos += windDir * (steadyBlow + disp);
            // Realistic billowing arc lift
            pos.y += abs(steadyBlow + disp) * 0.28 * pin;

            // Perturbed cloth normal so moonlight, golden sun & warm lamps catch crisp fabric folds
            float slopeY = cos(aLocalUV.y * 6.2 - uTime * (5.8 + wPow * 2.2) + aFlagSeed * 2.1) * 0.62 * pin * wPow;
            float slopeX = sin(aLocalUV.x * 8.0 - uTime * (8.5 + wPow * 3.0) + aFlagSeed * 4.7) * 0.36 * pin * wPow;
            vec3 n = normalize(normal + windDir * slopeY + vec3(slopeX, 0.18 * pin, -slopeX));

            vec4 worldPos = modelMatrix * vec4(pos, 1.0);
            vWorldPos = worldPos.xyz;
            vWorldNormal = normalize(mat3(modelMatrix) * n);

            vec4 mvPos = viewMatrix * worldPos;
            vFogDepth = -mvPos.z;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: /* glsl */`
          uniform sampler2D uTex;
          uniform float uDayFactor;
          uniform vec3 uFogColor;
          uniform float uFogDensity;
          uniform vec3 uSunDir;
          uniform vec3 uMoonDir;

          varying vec2 vLocalUV;
          varying vec3 vColor;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          varying float vFogDepth;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
          }

          void main() {
            // Weathered frayed cotton threads along bottom edge
            float fray = hash(vec2(floor(vLocalUV.x * 74.0), 1.0)) * 0.068;
            if (vLocalUV.y < fray) discard;

            vec3 printTex = texture2D(uTex, vLocalUV).rgb;
            vec3 albedo = vColor * printTex;

            vec3 N = normalize(vWorldNormal);
            if (!gl_FrontFacing) N = -N;
            vec3 V = normalize(cameraPosition - vWorldPos);

            vec3 L = normalize(mix(uMoonDir, uSunDir, uDayFactor));
            vec3 keyCol = mix(vec3(0.42, 0.56, 0.85), vec3(1.48, 1.04, 0.64), uDayFactor);
            vec3 ambCol = mix(vec3(0.11, 0.14, 0.24), vec3(0.46, 0.52, 0.64), uDayFactor);

            float ndl = max(dot(N, L), 0.0);
            // Thin handloom cotton subsurface backlighting!
            float sss = pow(max(dot(-V, L), 0.0), 2.4) * 0.78 + max(dot(-N, L), 0.0) * 0.45;
            vec3 lit = albedo * (ambCol + keyCol * (ndl * 0.86 + sss * 0.76));

            // Warm bounce from rooftop lanterns, butter lamps & café lattice window
            float nightMult = 1.0 - uDayFactor * 0.86;
            float dWarm = length(vWorldPos - vec3(-1.8, 1.9, -1.2));
            float attenWarm = 1.0 / (1.0 + 0.028 * dWarm * dWarm);
            lit += albedo * vec3(1.22, 0.68, 0.26) * attenWarm * 1.05 * nightMult;

            // Warm temple glow on stupa's radial prayer flags
            float dStupa = length(vWorldPos - vec3(5.5, 4.0, -68.0));
            float attenStupa = 1.0 / (1.0 + 0.0036 * dStupa * dStupa);
            lit += albedo * vec3(1.32, 0.92, 0.46) * attenStupa * 1.25 * nightMult;

            // Matching exponential valley fog
            float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * vFogDepth * vFogDepth);
            lit = mix(lit, uFogColor, clamp(fogFactor, 0.0, 1.0));

            gl_FragColor = vec4(lit, 1.0);
          }
        `
      });

      const mesh = new THREE.Mesh(geo, mat);
      const group = new THREE.Group();
      group.add(mesh);
      if (withRopes) group.add(ropeGroup);
      return { group, mesh, material: mat };
    }

    const heroFlagLines = [
      // Hero front arch framing Boudhanath Stupa
      { start: new THREE.Vector3(-6.80, 4.92, -5.72), end: new THREE.Vector3(6.80, 4.58, -5.72), sag: 0.62, colorOffset: 0 },
      // Secondary diagonal terrace line
      { start: new THREE.Vector3(-6.80, 4.28, -5.72), end: new THREE.Vector3(6.80, 3.92, 2.50), sag: 0.56, colorOffset: 2 },

      // Left side longitudinal line
      { start: new THREE.Vector3(-6.80, 5.08, 5.18),  end: new THREE.Vector3(-6.80, 4.84, -5.72), sag: 0.50, colorOffset: 3 },

    // =========================================================================
    // SECTION 10: BOUDHANATH STUPA (Museum-Grade Architectural Hero Landmark)
    // =========================================================================
    const stupaGroup = new THREE.Group();
    const STUPA_POS = new THREE.Vector3(5.5, -12.0, -68.0);

    // 1. Outer Circular Kora Circumambulation Wall with recessed Prayer Wheel niches
    const outerWall = new THREE.Mesh(

    // 2. Three Stepped Cruciform 20-Cornered Mandala Plinths (Authentic Boudhanath Geometry!)
    const mandalaTiers = [
      { w: 34.4, h: 3.1, y: 1.55 },

      // Warm golden upper terrace cornice trim

    // Warm Golden Temple Floodlight Aura Halos (atmospheric light scatter around Stupa at night)

    // Hundreds of sparkling golden butter-lamp / LED lights lining the 3 Mandala Terraces
    const stupaLampCoords = [];
    for (const t of mandalaTiers) {
      const half = t.w * 0.5 + 0.2;

    const stupaLampGeo = new THREE.BufferGeometry();

    const stupaLampMat = new THREE.PointsMaterial({

    // 24 Sweeping Radial Prayer Flag Cables cascading from Boudhanath's Golden Spire!
    const stupaFlagLines = [];

    for (let i = 0; i < numRays; i++) {

    const stupaRadialFlags = buildPrayerFlagSystem(stupaFlagLines, {

    // =========================================================================

    const facadeStyles = [

    function addKathmanduBuilding(x, z, w, d, h, rotY = 0, forceMonastery = false) {

      const par = new THREE.Mesh(new THREE.BoxGeometry(w + 0.18, 0.48, d + 0.18), cityRoofMat);

        const ganjira = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.22, 0.95, 10), stupaGoldMat);
        ganjira.position.y = h + 2.95;
        b.add(ganjira);
      } else if (pick.style.isNewari && rng() > 0.45) {
        // Sloped terracotta Newari gable roof
        const roofCone = new THREE.Mesh(
          new THREE.ConeGeometry(Math.max(w, d) * 0.72, 2.2, 4),
          jhingatiMat
        );
        roofCone.rotation.y = Math.PI * 0.25;
        roofCone.position.y = h + 1.1;
        b.add(roofCone);
      } else {
        // Typical Kathmandu rooftop clutter: stairwell penthouse, ribbed water tank, solar panel or railing
        if (rng() > 0.28) {
          const sh = 1.65 + rng() * 1.15;
          const sw = Math.min(w * 0.42, 3.3);
          const sd = Math.min(d * 0.42, 3.3);
          const stair = new THREE.Mesh(new THREE.BoxGeometry(sw, sh, sd), fMat);
          stair.position.set((rng() - 0.5) * (w - sw) * 0.55, h + sh * 0.5, (rng() - 0.5) * (d - sd) * 0.55);
          b.add(stair);
        }

        if (rng() > 0.22) {
          const tank = new THREE.Mesh(
            new THREE.CylinderGeometry(0.46, 0.46, 1.08, 10),
            rng() > 0.70 ? miniTankBlue : miniTankBlack
          );
          tank.position.set((rng() - 0.5) * w * 0.48, h + 0.74, (rng() - 0.5) * d * 0.48);
          b.add(tank);
        }

        if (rng() > 0.62) {
          // Rooftop pole / TV antenna silhouette
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 2.8, 6), darkIronMat);
          pole.position.set((rng() - 0.5) * w * 0.6, h + 1.4, (rng() - 0.5) * d * 0.6);
          b.add(pole);

      // Record midground rooftop anchor points for authentic overhead utility wires
      if (z < -10 && z > -46 && Math.abs(x) < 34) {
        roofAnchorPoints.push(new THREE.Vector3(x, -12.0 + h + 2.2, z));
      }

      cityGroup.add(b);

    // 1. Iconic Curved Boudhanath Kora Ring of Cafes, Thanka Shops & Monasteries
    const koraCount = 24;
    for (let i = 0; i < koraCount; i++) {
      const ang = (i / koraCount) * Math.PI * 2;
      const dist = 30.2 + rng() * 4.5;
      const bx = STUPA_POS.x + Math.cos(ang) * dist;
      const bz = STUPA_POS.z + Math.sin(ang) * dist;

      // Keep the direct front corridor slightly lower so the Stupa's mandala base & dome shine gloriously
      const inFront = (bz > STUPA_POS.z + 18 && Math.abs(bx - STUPA_POS.x) < 17.5);
      const h = inFront ? (7.2 + rng() * 2.0) : (10.8 + rng() * 4.4);
      const isMonastery = !inFront && (i === 5 || i === 15 || i === 20);
      addKathmanduBuilding(bx, bz, 7.6 + rng() * 2.8, 6.4 + rng() * 2.4, h, -ang + Math.PI * 0.5, isMonastery);
    }

    // 2. Dense 360-degree Kathmandu Urban Sea surrounding our rooftop
    for (let i = 0; i < 155; i++) {
      const ang = rng() * Math.PI * 2;
      const rad = 16.5 + Math.pow(rng(), 0.70) * 118.0;
      const bx = Math.cos(ang) * rad;
      const bz = Math.sin(ang) * rad - 16.0;

      // Keep clear of our rooftop building
      if (Math.abs(bx) < 12.8 && Math.abs(bz) < 11.6) continue;
      // Keep clear of Boudhanath Kora plaza
      if (Math.hypot(bx - STUPA_POS.x, bz - STUPA_POS.z) < 33.5) continue;

      // Preserve curated sightline corridor toward Boudhanath Stupa
      const tLine = clamp01((-bz) / 68.0);
      const lineX = THREE.MathUtils.lerp(0.0, STUPA_POS.x, tLine);
      const inSightCorridor = (bz < -7.0 && bz > -64.0 && Math.abs(bx - lineX) < 13.0);

      const w = 6.4 + rng() * 6.8;
      const d = 6.4 + rng() * 6.8;
      const h = inSightCorridor ? (6.4 + rng() * 3.5) : (8.8 + rng() * 8.4);

      addKathmanduBuilding(bx, bz, w, d, h, (rng() - 0.5) * 0.34, rng() > 0.93 && !inSightCorridor);
    }

    // 3. Authentic Kathmandu Tangled Overhead Utility Poles & Catenary Power Wires across Midground Alleyways
    const wireMat = new THREE.LineBasicMaterial({ color: '#1b1d26', transparent: true, opacity: 0.72 });
    for (let i = 0; i < roofAnchorPoints.length; i++) {
      const p1 = roofAnchorPoints[i];
      // Connect to 1-2 nearby neighboring roofs
      let connected = 0;
      for (let j = i + 1; j < roofAnchorPoints.length && connected < 2; j++) {
        const p2 = roofAnchorPoints[j];

          connected++;
          for (let strand = 0; strand < 2; strand++) {
            const pts = [];
            const sag = 0.75 + strand * 0.42;
            for (let s = 0; s <= 12; s++) {
              const t = s / 12;
              const p = new THREE.Vector3().lerpVectors(p1, p2, t);
              p.y -= Math.sin(t * Math.PI) * sag + strand * 0.25;

            cityGroup.add(new THREE.Line(geo, wireMat));

    // 4. Warm Street-Level Sodium-Vapor Alleyway Glow Sprites rising between Midground Buildings

    // =========================================================================
    // SECTION 12: HIMALAYAN FOOTHILLS & DISTANT SNOW-CAPPED LANGTANG PEAKS
    // =========================================================================
    const mountainMeshes = [];

    function addValleyMountainRing(radius, baseH, peakH, nightCol, dayCol, seedVal, isSnowRange = false) {
      const segs = 160;
      const geo = new THREE.CylinderGeometry(radius, radius * 1.07, 1, segs, 10, true);
      const pos = geo.attributes.position;
      const colors = [];

      const cBase = new THREE.Color('#1a2234');
      const cSnow = new THREE.Color('#dde8f8');

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);
        const angle = Math.atan2(vz, vx);

        // Northern Shivapuri & Langtang Himal rise dramatically behind Boudhanath Stupa (-Z direction)
        const northBias = isSnowRange
          ? Math.pow(Math.max(0, -Math.sin(angle)), 1.35)
          : (0.62 + 0.56 * Math.max(0, -Math.sin(angle)));

        const n1 = isSnowRange
          ? ridgedFbm2D(Math.cos(angle) * 3.6 + seedVal, Math.sin(angle) * 3.6 + seedVal, 5)
          : fbm2D(Math.cos(angle) * 2.5 + seedVal, Math.sin(angle) * 2.5 + seedVal, 4);

        const n2 = fbm2D(Math.cos(angle) * 7.2 - seedVal, Math.sin(angle) * 7.2 + seedVal, 3);
        const ridgeH = (baseH + (n1 * 0.78 + n2 * 0.22) * peakH) * northBias;

        const normY = vy + 0.5; // 0 = base, 1 = summit
        const finalY = -18.0 + normY * ridgeH;
        pos.setY(i, finalY);

        if (isSnowRange) {
          const snowMix = smoothstep(0.62, 0.90, normY) * smoothstep(25.0, 62.0, ridgeH);
          const col = cBase.clone().lerp(cSnow, snowMix);
          colors.push(col.r, col.g, col.b);
        }
      }
      geo.computeVertexNormals();

      if (isSnowRange) {
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      }

      const mat = new THREE.MeshStandardMaterial({
        color: nightCol,
        vertexColors: isSnowRange,
        roughness: isSnowRange ? 0.85 : 0.96,
        metalness: 0.0,
        side: THREE.BackSide
      });

      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
      mountainMeshes.push({
        mesh,
        mat,
        nightColor: new THREE.Color(nightCol),
        dayColor: new THREE.Color(dayCol),
        isSnowRange
      });
    }

    // 3 Forested Kathmandu Valley Rim Rings (Shivapuri / Nagarjun / Phulchowki)
    addValleyMountainRing(182, 16, 36, '#13192a', '#48566d', 2.9, false);
    addValleyMountainRing(255, 26, 54, '#182136', '#697488', 9.4, false);
    addValleyMountainRing(335, 36, 70, '#1e2842', '#898d98', 16.8, false);
    // Majestic Far Snow-Capped Himalayan Peaks (Langtang / Jugal Himal silhouette kissing the northern sky!)
    addValleyMountainRing(455, 42, 128, '#2d3a58', '#f2d4c2', 31.2, true);

    // Distant Twinkling Hillside Village Lights nestled along the Kathmandu valley slopes (Night)
    const hillLightPositions = [];
    const hillLightColors = [];
    for (let i = 0; i < 520; i++) {
      const ang = rng() * Math.PI * 2;
      const rad = 148 + rng() * 38;
      const hx = Math.cos(ang) * rad;
      const hz = Math.sin(ang) * rad;
      const hy = -6 + Math.pow(rng(), 1.85) * 25;
      hillLightPositions.push(hx, hy, hz);
      const warm = rng() > 0.22;
      hillLightColors.push(
        warm ? 1.0 : 0.74,
        warm ? (0.66 + rng() * 0.26) : 0.86,
        warm ? 0.32 : 1.0
      );
    }
    const hillLightGeo = new THREE.BufferGeometry();
    hillLightGeo.setAttribute('position', new THREE.Float32BufferAttribute(hillLightPositions, 3));
    hillLightGeo.setAttribute('color', new THREE.Float32BufferAttribute(hillLightColors, 3));
    const hillLightMat = new THREE.PointsMaterial({
      size: 1.7,
      map: softGlowTex,
      vertexColors: true,
      transparent: true,
      opacity: 0.82,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const hillLights = new THREE.Points(hillLightGeo, hillLightMat);
    scene.add(hillLights);

    // =========================================================================
    // SECTION 13: VOLUMETRIC-STYLE DRIFTING KATHMANDU VALLEY MIST SHADER
    // =========================================================================
    const mistShaderMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        uTime: sharedUniforms.uTime,
        uDayFactor: sharedUniforms.uDayFactor,
        uFogColor: sharedUniforms.uFogColor
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime;
        uniform float uDayFactor;
        uniform vec3 uFogColor;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }

        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 4; i++) {
            v += a * noise(p);
            p = p * 2.02 + vec2(4.3, 2.7);
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec2 p = vUv * 2.0 - 1.0;
          float radial = smoothstep(1.0, 0.12, length(p * vec2(1.0, 1.25)));
          float n = fbm(vUv * 3.4 + vec2(uTime * 0.022, -uTime * 0.008));
          float alpha = radial * smoothstep(0.28, 0.82, n) * mix(0.16, 0.13, uDayFactor);

          vec3 nightMist = mix(uFogColor * 1.45, vec3(0.45, 0.32, 0.22), 0.28);
          vec3 dayMist   = vec3(0.95, 0.78, 0.60);
          vec3 col = mix(nightMist, dayMist, uDayFactor);

          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    const mistPlanes = [];
    for (let i = 0; i < 16; i++) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(66 + rng() * 38, 22 + rng() * 14), mistShaderMat);
      const baseX = (rng() - 0.5) * 105;
      const baseY = -5.5 + rng() * 9.5;
      const baseZ = -22.0 - rng() * 72.0;
      m.position.set(baseX, baseY, baseZ);
      scene.add(m);
      mistPlanes.push({
        mesh: m,
        baseX,
        speed: 0.35 + rng() * 0.65,
        phase: rng() * Math.PI * 2
      });
    }

    // =========================================================================
    // SECTION 14: DRIFTING SKY LANTERNS (Glowing Translucent Khom Loy)
    // =========================================================================
    const lanternProfile = [
      new THREE.Vector2(0.15, 0.00),
      new THREE.Vector2(0.23, 0.14),
      new THREE.Vector2(0.30, 0.42),
      new THREE.Vector2(0.26, 0.68),
      new THREE.Vector2(0.14, 0.80),
      new THREE.Vector2(0.00, 0.84)
    ];
    const lanternGeo = new THREE.LatheGeometry(lanternProfile, 16);
    const lanternRimGeo = new THREE.TorusGeometry(0.15, 0.008, 6, 14);
    const lanternFlameGeo = new THREE.SphereGeometry(0.042, 8, 8);

    const skyLanternMat = new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: false,
      uniforms: {
        uTime: sharedUniforms.uTime,
        uDayFactor: sharedUniforms.uDayFactor,
        uFogColor: sharedUniforms.uFogColor,
        uFogDensity: sharedUniforms.uFogDensity
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        varying float vFogDepth;
        void main() {
          vUv = uv;
          vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
          vFogDepth = -mvPos.z;
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime;
        uniform float uDayFactor;
        uniform vec3 uFogColor;
        uniform float uFogDensity;

        varying vec2 vUv;
        varying float vFogDepth;

        void main() {
          float h = vUv.y;
          // Luminous warm candle core at base -> glowing amber-saffron body -> deep burnt-orange crown
          vec3 coreCol = vec3(3.4, 2.45, 1.20);
          vec3 midCol  = vec3(2.35, 1.08, 0.28);
          vec3 topCol  = vec3(1.18, 0.38, 0.10);

          vec3 col = mix(coreCol, midCol, smoothstep(0.0, 0.45, h));
          col = mix(col, topCol, smoothstep(0.42, 0.96, h));

          // Vertical mulberry-paper ribs
          float rib = smoothstep(0.92, 1.0, abs(sin(vUv.x * 3.14159 * 6.0)));
          col *= (1.0 - rib * 0.20);

          // Graceful dimming into delicate translucent paper during daytime
          vec3 dayPaper = vec3(0.96, 0.76, 0.52);
          col = mix(col, dayPaper, uDayFactor * 0.86);
          float alpha = mix(0.97, 0.14, uDayFactor);

          float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * vFogDepth * vFogDepth);
          col = mix(col, uFogColor, clamp(fogFactor * 0.62, 0.0, 1.0));

          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    const lanternWireMat = new THREE.MeshBasicMaterial({ color: '#1c1410' });
    const lanternCoreMat = new THREE.MeshBasicMaterial({ color: '#fff2c4' });

    const skyLanterns = [];
    const LANTERN_COUNT = 52;

    for (let i = 0; i < LANTERN_COUNT; i++) {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(lanternGeo, skyLanternMat));

      g.position.set(x, y, z);

      skyLanterns.push({

    // Subtle Floating Warm Dust Motes / Fireflies dancing near Rooftop Terrace
    const moteCount = 65;
    const motePositions = new Float32Array(moteCount * 3);
    const moteSeeds = [];
    for (let i = 0; i < moteCount; i++) {

    const moteGeo = new THREE.BufferGeometry();

    const moteMat = new THREE.PointsMaterial({
