    // =========================================================================
    // SECTION 15: DAYTIME SOARING VALLEY PIGEONS / EAGLES AROUND BOUDHANATH
    // =========================================================================
    const birdFlock = [];
    const birdGeo = new THREE.BufferGeometry();
    birdGeo.setAttribute('position', new THREE.Float32BufferAttribute([
      0.0, 0.0,  0.14,   -0.42, 0.06, -0.08,   0.0, 0.0, -0.15,

    const birdMat = new THREE.ShaderMaterial({

        uniform float uTime;
        void main() {
          vec3 p = position;
          float flap = sin(uTime * 8.2 + modelMatrix[3].x * 0.65 + modelMatrix[3].z * 0.55);
          p.y += abs(p.x) * flap * 0.48;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uDayFactor;
        void main() {
          gl_FragColor = vec4(0.15, 0.14, 0.16, smoothstep(0.24, 0.85, uDayFactor) * 0.88);
        }
      `
    });

    for (let i = 0; i < 18; i++) {

      birdFlock.push({

    // =========================================================================
    // SECTION 16: PROCEDURAL WEB AUDIO KATHMANDU ROOFTOP SOUNDSCAPE
    // (100% Synthesized Web Audio API: Wind, Tibetan Singing Bowl, Distant Temple Bells)
    // =========================================================================
    class KathmanduSoundscape {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.windFilter = null;
        this.windGain = null;
        this.isPlaying = false;
        this.bellTimer = null;
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.0;
        this.masterGain.connect(this.ctx.destination);

        // 1. Filtered Pink Noise — Himalayan rooftop breeze rustling prayer flags
        const bufSize = this.ctx.sampleRate * 4;
        const noiseBuf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const out = noiseBuf.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.032;
          b6 = white * 0.115926;
        }
        const windSrc = this.ctx.createBufferSource();
        windSrc.buffer = noiseBuf;
        windSrc.loop = true;

        this.windFilter = this.ctx.createBiquadFilter();
        this.windFilter.type = 'bandpass';
        this.windFilter.frequency.value = 340;
        this.windFilter.Q.value = 1.4;

        this.windGain = this.ctx.createGain();
        this.windGain.gain.value = 0.42;

        windSrc.connect(this.windFilter);
        this.windFilter.connect(this.windGain);
        this.windGain.connect(this.masterGain);
        windSrc.start();

        // 2. Warm Meditative Tibetan Temple Harmonic Drone (D2 + A2 + F#3 subtle shimmer)
        const droneFreqs = [73.42, 110.0, 146.83, 220.0];
        const droneGains = [0.055, 0.032, 0.018, 0.009];
        droneFreqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          osc.type = idx === 0 ? 'sine' : 'triangle';
          osc.frequency.value = f;

          const filt = this.ctx.createBiquadFilter();
          filt.type = 'lowpass';
          filt.frequency.value = 380;

          const g = this.ctx.createGain();
          g.gain.value = droneGains[idx];

          // Gentle breathing LFO
          const lfo = this.ctx.createOscillator();
          lfo.frequency.value = 0.07 + idx * 0.031;
          const lfoGain = this.ctx.createGain();
          lfoGain.gain.value = droneGains[idx] * 0.35;
          lfo.connect(lfoGain);
          lfoGain.connect(g.gain);
          lfo.start();

          osc.connect(filt);
          filt.connect(g);
          g.connect(this.masterGain);
          osc.start();
        });
      }

      playSingingBowlChime() {
        if (!this.ctx || !this.isPlaying) return;
        const now = this.ctx.currentTime;
        const baseChoices = [293.66, 329.63, 440.0, 587.33]; // D4, E4, A4, D5 pentatonic temple tones
        const base = baseChoices[Math.floor(Math.random() * baseChoices.length)];
        const partials = [1.0, 2.756, 5.404]; // Metallic bell / Tibetan bowl inharmonic partials

        partials.forEach((ratio, idx) => {
          const osc = this.ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = base * ratio + (Math.random() - 0.5) * 0.8;

          const g = this.ctx.createGain();
          const amp = (idx === 0 ? 0.038 : idx === 1 ? 0.016 : 0.006);
          const dur = idx === 0 ? 7.5 : idx === 1 ? 4.2 : 2.1;

          g.gain.setValueAtTime(0.0001, now);
          g.gain.linearRampToValueAtTime(amp, now + 0.06);
          g.gain.exponentialRampToValueAtTime(0.00008, now + dur);

          osc.connect(g);
          g.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + dur + 0.1);
        });
      }

      scheduleNextBell() {
        if (!this.isPlaying) return;
        const delay = 4800 + Math.random() * 7500;
        this.bellTimer = setTimeout(() => {
          this.playSingingBowlChime();
          this.scheduleNextBell();
        }, delay);
      }

      toggle() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        this.isPlaying = !this.isPlaying;
        const now = this.ctx.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now);

        if (this.isPlaying) {
          this.masterGain.gain.linearRampToValueAtTime(0.85, now + 1.6);
          setTimeout(() => this.playSingingBowlChime(), 600);
          this.scheduleNextBell();
        } else {
          this.masterGain.gain.linearRampToValueAtTime(0.0, now + 0.8);
          if (this.bellTimer) clearTimeout(this.bellTimer);
        }
        return this.isPlaying;
      }

      updateWind(elapsed, windStrength) {
        if (!this.ctx || !this.isPlaying || !this.windFilter) return;
        const gust = 0.65 + 0.35 * Math.sin(elapsed * 0.78);
        const freq = 220 + gust * windStrength * 290;
        this.windFilter.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.25);
        this.windGain.gain.setTargetAtTime(0.22 + gust * windStrength * 0.26, this.ctx.currentTime, 0.25);
      }
    }

    const soundscape = new KathmanduSoundscape();

    // =========================================================================
    // SECTION 17: CINEMATIC CAMERA CHOREOGRAPHY & INTERACTIVE CONTROLS
    // =========================================================================
    const CAMERA_SHOTS = {
      terrace: { pos: new THREE.Vector3(-4.35, 2.28, 5.15), target: new THREE.Vector3(1.55, 2.35, -14.5) },
      chiya:   { pos: new THREE.Vector3(-2.55, 1.48, 3.05), target: new THREE.Vector3(1.25, 1.72, -14.0) },
      stupa:   { pos: new THREE.Vector3( 1.95, 2.05, -2.65), target: new THREE.Vector3(5.45, 7.60, -68.0) },
      flags:   { pos: new THREE.Vector3( 4.65, 2.92, 3.25), target: new THREE.Vector3(-0.85, 3.35, -12.0) }
    };

    const WIND_MODES = [
      { label: 'Calm',   value: 0.48 },
      { label: 'Breeze', value: 1.00 },
      { label: 'Gusty',  value: 1.72 }
    ];

    let windModeIdx = 1;
    let targetWind = 1.0;
    let currentWind = 1.0;

    let targetDayFactor = 0.0; // Starts in atmospheric Moonlit Night
    let currentDayFactor = 0.0;

    let isOrbiting = true;
    let activeShotName = 'orbit';
    let shotTransitioning = false;
    let shotGoalPos = new THREE.Vector3();
    let shotGoalTarget = new THREE.Vector3();
    let orbitPhase = 0.0;
    let userInteracting = false;

    // UI Elements
    const btnTime = document.getElementById('btn-time');
    const iconMoon = document.getElementById('icon-moon');
    const iconSun = document.getElementById('icon-sun');
    const labelTime = document.getElementById('label-time');
    const metaMood = document.getElementById('meta-mood');

    const btnWind = document.getElementById('btn-wind');
    const labelWind = document.getElementById('label-wind');

    const btnAudio = document.getElementById('btn-audio');
    const iconAudioOff = document.getElementById('icon-audio-off');
    const iconAudioOn = document.getElementById('icon-audio-on');

    const btnOrbit = document.getElementById('btn-orbit');
    const orbitPlayIcon = document.getElementById('orbit-play-icon');
    const orbitPauseIcon = document.getElementById('orbit-pause-icon');

    const btnBars = document.getElementById('btn-bars');
    const btnHideHud = document.getElementById('btn-hide-hud');
    const btnRestoreHud = document.getElementById('btn-restore-hud');
    const shotPills = document.querySelectorAll('.shot-pill');

    function updateShotPills(activeName) {
      activeShotName = activeName;
      shotPills.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.shot === activeName);
      });
    }

    function setOrbitState(active) {
      isOrbiting = active;
      btnOrbit.classList.toggle('active', active);
      orbitPauseIcon.style.display = active ? 'block' : 'none';
      orbitPlayIcon.style.display  = active ? 'none' : 'block';
      if (active) {
        shotTransitioning = false;
        updateShotPills('orbit');
      }
    }

    function toggleDayNight() {
      targetDayFactor = targetDayFactor < 0.5 ? 1.0 : 0.0;
      const isDay = targetDayFactor > 0.5;
      iconMoon.style.display = isDay ? 'none' : 'block';
      iconSun.style.display  = isDay ? 'block' : 'none';
      labelTime.textContent  = isDay ? 'Golden Day' : 'Night';
      metaMood.textContent   = isDay ? 'GOLDEN HOUR · HIMALAYAN HAZE' : 'NIGHT · MOONLIT HAZE';
      btnTime.classList.toggle('active', isDay);
    }

    function cycleWind() {
      windModeIdx = (windModeIdx + 1) % WIND_MODES.length;
      targetWind = WIND_MODES[windModeIdx].value;
      labelWind.textContent = WIND_MODES[windModeIdx].label;
      btnWind.classList.toggle('active', windModeIdx > 0);
    }

    function toggleAudio() {
      const playing = soundscape.toggle();
      btnAudio.classList.toggle('active', playing);
      iconAudioOff.style.display = playing ? 'none' : 'block';
      iconAudioOn.style.display  = playing ? 'block' : 'none';
    }

    btnTime.addEventListener('click', toggleDayNight);
    btnWind.addEventListener('click', cycleWind);
    btnAudio.addEventListener('click', toggleAudio);
    btnOrbit.addEventListener('click', () => setOrbitState(!isOrbiting));

    btnBars.addEventListener('click', () => {
      const on = document.body.classList.toggle('cinema-bars');
      btnBars.classList.toggle('active', on);
    });

    btnHideHud.addEventListener('click', () => document.body.classList.add('hud-hidden'));
    btnRestoreHud.addEventListener('click', () => document.body.classList.remove('hud-hidden'));

    shotPills.forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.shot;
        if (key === 'orbit') {
          setOrbitState(true);
        } else if (CAMERA_SHOTS[key]) {
          setOrbitState(false);
          shotGoalPos.copy(CAMERA_SHOTS[key].pos);
          shotGoalTarget.copy(CAMERA_SHOTS[key].target);
          shotTransitioning = true;
          updateShotPills(key);
        }
      });
    });

    controls.addEventListener('start', () => {
      userInteracting = true;
      shotTransitioning = false;
      if (isOrbiting) setOrbitState(false);
    });
    controls.addEventListener('end', () => {
      userInteracting = false;
    });

    // Cinema keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const k = e.key.toLowerCase();
      if (k === 't') toggleDayNight();
      else if (k === 'w') cycleWind();
      else if (k === 'm') toggleAudio();
      else if (k === ' ') { e.preventDefault(); setOrbitState(!isOrbiting); }
      else if (k === 'b') {
        const on = document.body.classList.toggle('cinema-bars');
        btnBars.classList.toggle('active', on);
      }
      else if (k === 'h') document.body.classList.toggle('hud-hidden');
      else if (k === '1') setOrbitState(true);
      else if (k === '2') document.querySelector('[data-shot="terrace"]').click();
      else if (k === '3') document.querySelector('[data-shot="chiya"]').click();
      else if (k === '4') document.querySelector('[data-shot="stupa"]').click();
      else if (k === '5') document.querySelector('[data-shot="flags"]').click();
    });

    // =========================================================================
    // SECTION 18: DYNAMIC ATMOSPHERE INTERPOLATOR (Night <-> Dusk <-> Golden Day)
    // =========================================================================
    const tmpCol = new THREE.Color();
    const tmpCol2 = new THREE.Color();
    const keyDirVec = new THREE.Vector3();

    const NIGHT_HEMI_SKY = new THREE.Color('#2c477d');
    const DUSK_HEMI_SKY  = new THREE.Color('#6a456e');
    const DAY_HEMI_SKY   = new THREE.Color('#9ec6eb');

    const NIGHT_HEMI_GND = new THREE.Color('#2a1c14');
    const DAY_HEMI_GND   = new THREE.Color('#70543e');

    const NIGHT_KEY_COL  = new THREE.Color('#80a8ea');
    const DUSK_KEY_COL   = new THREE.Color('#ff8446');
    const DAY_KEY_COL    = new THREE.Color('#ffc078');

    const tmpGoalCam = new THREE.Vector3();
    const tmpGoalTgt = new THREE.Vector3();

    function updateAtmosphere(dayT, elapsed) {
      sharedUniforms.uDayFactor.value = dayT;
      filmPass.uniforms.uDayFactor.value = dayT;

      const dusk = Math.sin(dayT * Math.PI);

      // Swap baked PMREM environment texture smoothly across twilight threshold
      const wantDayEnv = dayT > 0.52;
      if (wantDayEnv !== activeEnvIsDay) {
        scene.environment = wantDayEnv ? envDayRT.texture : envNightRT.texture;
        activeEnvIsDay = wantDayEnv;
      }

      // Three-phase atmospheric Fog (Night indigo -> Dusk plum -> Golden peach)
      tmpCol.lerpColors(NIGHT_FOG_COLOR, DAY_FOG_COLOR, dayT);
      tmpCol.lerp(DUSK_FOG_COLOR, dusk * 0.42);
      scene.fog.color.copy(tmpCol);

      const baseDens = THREE.MathUtils.lerp(NIGHT_FOG_DENSITY, DAY_FOG_DENSITY, dayT);
      scene.fog.density = THREE.MathUtils.lerp(baseDens, DUSK_FOG_DENSITY, dusk * 0.3);
      sharedUniforms.uFogColor.value.copy(tmpCol);
      sharedUniforms.uFogDensity.value = scene.fog.density;

      // Hemisphere & Key Directional Lights
      tmpCol.lerpColors(NIGHT_HEMI_SKY, DAY_HEMI_SKY, dayT);
      tmpCol.lerp(DUSK_HEMI_SKY, dusk * 0.42);
      hemiLight.color.copy(tmpCol);
      hemiLight.groundColor.lerpColors(NIGHT_HEMI_GND, DAY_HEMI_GND, dayT);
      hemiLight.intensity = THREE.MathUtils.lerp(0.50, 1.02, dayT);

      tmpCol2.lerpColors(NIGHT_KEY_COL, DAY_KEY_COL, dayT);
      tmpCol2.lerp(DUSK_KEY_COL, dusk * 0.5);
      keyLight.color.copy(tmpCol2);
      keyLight.intensity = THREE.MathUtils.lerp(1.02, 2.85, dayT);
      keyDirVec.lerpVectors(sharedUniforms.uMoonDir.value, sharedUniforms.uSunDir.value, dayT).normalize();
      keyLight.position.copy(keyDirVec).multiplyScalar(90);

      valleyBounceLight.intensity = THREE.MathUtils.lerp(0.28, 0.04, dayT);

      // Warm Practical Rooftop Lights (flickering organically like real oil flames & warm tungsten)
      const nightStrength = 1.0 - dayT * 0.88;
      const fl1 = 0.94 + 0.055 * Math.sin(elapsed * 7.1) + 0.025 * Math.sin(elapsed * 16.3);
      const fl2 = 0.92 + 0.075 * Math.sin(elapsed * 9.3 + 1.5);
      const fl3 = 0.95 + 0.050 * Math.sin(elapsed * 5.8 + 3.2);

      pavilionLight.intensity      = 5.8 * nightStrength * fl1;
      latticeWindowLight.intensity = 3.8 * nightStrength * fl3;
      tableLight.intensity         = 3.9 * nightStrength * fl2;
      parapetLightL.intensity      = 2.8 * nightStrength * fl1;
      parapetLightR.intensity      = 2.8 * nightStrength * fl2;

      hangLanternGlowMat.emissiveIntensity = THREE.MathUtils.lerp(3.4, 0.35, dayT) * fl1;
      tblLampGlowMat.emissiveIntensity     = THREE.MathUtils.lerp(3.9, 0.42, dayT) * fl2;
      winGlowMat.emissiveIntensity         = THREE.MathUtils.lerp(3.5, 0.28, dayT) * fl3;

      for (const fl of fairyLightMats) {
        const tw = 0.90 + 0.10 * Math.sin(elapsed * 3.8 + fl.phase);
        fl.mat.emissiveIntensity = THREE.MathUtils.lerp(3.6, 0.18, dayT) * tw;
      }

      // Boudhanath Stupa Night Architectural Uplighting vs. Natural Golden Sunlight
      stupaWhiteMat.emissiveIntensity  = THREE.MathUtils.lerp(0.28, 0.02, dayT);
      stupaDomeMat.emissiveIntensity   = THREE.MathUtils.lerp(0.40, 0.04, dayT);
      stupaGoldMat.emissiveIntensity   = THREE.MathUtils.lerp(0.88, 0.12, dayT);
      harmikaFaceMat.emissiveIntensity = THREE.MathUtils.lerp(0.70, 0.05, dayT);
      nicheGlowMat.emissiveIntensity   = THREE.MathUtils.lerp(2.40, 0.08, dayT);
      stupaGlowSprite.material.opacity = THREE.MathUtils.lerp(0.36, 0.00, dayT);
      spireGlowSprite.material.opacity = THREE.MathUtils.lerp(0.50, 0.06, dayT);
      stupaLampMat.opacity             = THREE.MathUtils.lerp(0.95, 0.00, dayT);

      // Neighborhood Windows, Street Sodium Haze & Valley Hillside Village Lights
      const winEmis = THREE.MathUtils.lerp(1.44, 0.03, dayT);
      for (const c of cityFacadeMats) c.mat.emissiveIntensity = winEmis;
      ownBuildingMat.emissiveIntensity = winEmis * 0.9;
      hillLightMat.opacity = THREE.MathUtils.lerp(0.84, 0.0, dayT);

      for (const sp of streetGlowSprites) {
        sp.material.opacity = THREE.MathUtils.lerp(0.18, 0.0, dayT);
      }

      // Valley Rim Foothills & Alpenglow Himalayan Snow Peaks
      for (const m of mountainMeshes) {
        m.mat.color.lerpColors(m.nightColor, m.dayColor, dayT);
        if (m.isSnowRange) {
          // Subtle rose-pink Himalayan alpenglow blush at dusk & late afternoon!
          m.mat.color.lerp(new THREE.Color('#f09c82'), dusk * 0.35);
        }
      }

      // Subtle rooftop dust motes
      moteMat.opacity = THREE.MathUtils.lerp(0.46, 0.24, dayT);

      // Filmic Exposure & Soft Optical Bloom Calibration
      renderer.toneMappingExposure = THREE.MathUtils.lerp(1.08, 0.96, dayT);
      bloomPass.strength  = THREE.MathUtils.lerp(0.55, 0.22, dayT);
      bloomPass.threshold = THREE.MathUtils.lerp(0.72, 0.88, dayT);
    }

    // =========================================================================
    // SECTION 19: MAIN 60FPS CINEMATIC ANIMATION LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      sharedUniforms.uTime.value = elapsed;
      filmPass.uniforms.uTime.value = elapsed;

      // Smooth Day / Night & Wind strength transitions
      if (Math.abs(targetDayFactor - currentDayFactor) > 0.0003) {
        currentDayFactor += (targetDayFactor - currentDayFactor) * Math.min(1.0, dt * 1.45);
      } else {
        currentDayFactor = targetDayFactor;
      }

      currentWind += (targetWind - currentWind) * Math.min(1.0, dt * 2.4);
      sharedUniforms.uWindStrength.value = currentWind;

      updateAtmosphere(currentDayFactor, elapsed);
      soundscape.updateWind(elapsed, currentWind);

      // Camera Choreography: Slow Meditative Cinematic Orbit OR Smooth Preset Glide
      if (isOrbiting && !userInteracting) {
        orbitPhase += dt * 0.078; // Graceful, film-director pace (~80s arc cycle)
        const az = Math.sin(orbitPhase - 0.52) * 0.58;
        const rad = 8.45 + Math.cos(orbitPhase * 0.68) * 1.15;
        const cx = Math.sin(az) * rad;
        const cz = Math.cos(az) * rad * 0.72 - 0.65;
        const cy = 2.34 + Math.sin(orbitPhase * 1.25) * 0.34;

        tmpGoalCam.set(cx, cy, cz);
        tmpGoalTgt.set(
          1.60 + Math.sin(orbitPhase * 0.52) * 0.90,
          2.42 + Math.cos(orbitPhase * 0.78) * 0.26,
          -14.5
        );

        const k = Math.min(1.0, dt * 1.65);
        camera.position.lerp(tmpGoalCam, k);
        controls.target.lerp(tmpGoalTgt, k);
      } else if (shotTransitioning && !userInteracting) {
        const k = Math.min(1.0, dt * 2.8);
        camera.position.lerp(shotGoalPos, k);
        controls.target.lerp(shotGoalTarget, k);
        if (camera.position.distanceTo(shotGoalPos) < 0.025 && controls.target.distanceTo(shotGoalTarget) < 0.025) {
          shotTransitioning = false;
        }
      }
      controls.update();

      // 1. Gentle wind sway on hanging brass pavilion lantern
      hangLanternGroup.rotation.z = Math.sin(elapsed * 1.35) * 0.042 * currentWind;
      hangLanternGroup.rotation.x = Math.cos(elapsed * 1.02) * 0.028 * currentWind;

      // 2. Meditative slow spin on Tibetan Mani Prayer Wheel
      maniCylinder.rotation.y = elapsed * 0.42;

      // 3. Flickering parapet brass butter lamps (Diyas)
      const nightGlow = 1.0 - currentDayFactor * 0.84;
      for (const d of diyaFlames) {
        const fl = 0.85 + 0.25 * Math.sin(elapsed * 11.2 + d.phase) * Math.cos(elapsed * 6.5 + d.phase);
        d.flame.scale.set(0.94, fl, 0.94);
        d.flame.rotation.z = Math.sin(elapsed * 8.4 + d.phase) * 0.14 * currentWind;
        d.glow.scale.setScalar(0.42 * fl);
        d.glow.material.opacity = 0.84 * nightGlow;
      }

      // 4. Delicate rising steam wisps from hot Masala Chiya cups
      for (const s of steamParticles) {
        const cyc = (elapsed * 0.32 + s.phase) % 1.0;
        s.sprite.position.set(
          s.baseX + Math.sin(elapsed * 1.5 + s.phase * 5.0) * 0.04 * cyc + cyc * 0.05 * currentWind,
          0.58 + cyc * 0.54,
          s.baseZ + Math.cos(elapsed * 1.2 + s.phase * 4.0) * 0.035 * cyc
        );
        s.sprite.material.opacity = Math.sin(cyc * Math.PI) * 0.15;
        const sc = 0.08 + cyc * 0.15;
        s.sprite.scale.set(sc, sc * 1.3, 1);
      }

      // 5. Gracefully curling Tibetan Sandalwood Incense Smoke ribbon
      for (const p of incenseSmokeParticles) {
        const cyc = (elapsed * 0.22 + p.phase) % 1.0;
        const driftX = cyc * 0.45 * currentWind + Math.sin(elapsed * 1.9 + cyc * 8.5) * 0.05 * cyc;
        const driftZ = -cyc * 0.32 * currentWind + Math.cos(elapsed * 1.6 + cyc * 7.0) * 0.04 * cyc;
        p.sprite.position.set(-0.398 + driftX, 0.67 + cyc * 1.15, 0.22 + driftZ);
        p.sprite.material.opacity = Math.sin(cyc * Math.PI) * (1.0 - cyc * 0.5) * 0.16;
        const sc = 0.045 + cyc * 0.24;
        p.sprite.scale.set(sc, sc * 1.15, 1);
      }

      // 6. Drifting Translucent Paper Sky Lanterns ascending toward the Himalayan stars
      for (const l of skyLanterns) {
        l.group.position.y += l.riseSpeed * dt;
        if (l.group.position.y > l.yMax) {
          l.group.position.y = l.yMin;
        }
        const hNorm = (l.group.position.y - l.yMin) / (l.yMax - l.yMin);
        const lifeScale = Math.sin(Math.min(hNorm * 6.0, 1.0) * Math.PI * 0.5) *
                          (1.0 - Math.max(0.0, (hNorm - 0.80) / 0.20));
        l.group.scale.setScalar(Math.max(0.001, l.baseScale * lifeScale));

        l.group.position.x = l.baseX + Math.sin(elapsed * l.swayFreq + l.phase) * l.swayAmp + hNorm * 7.5 * currentWind;
        l.group.position.z = l.baseZ + Math.cos(elapsed * l.swayFreq * 0.8 + l.phase) * l.swayAmp * 0.65;
        l.group.rotation.z = Math.sin(elapsed * l.wobbleSpeed + l.phase) * 0.095;
        l.group.rotation.x = Math.cos(elapsed * l.wobbleSpeed * 0.8 + l.phase) * 0.072;

        const pulse = 0.88 + 0.12 * Math.sin(elapsed * 5.6 + l.phase * 3.0);
        l.halo.material.opacity = 0.46 * (1.0 - currentDayFactor * 0.94) * lifeScale * pulse;
        l.coreFlame.visible = currentDayFactor < 0.72;
      }

      // 7. Warm floating rooftop dust motes / subtle fireflies
      const mAttr = moteGeo.attributes.position;
      for (let i = 0; i < moteCount; i++) {
        const s = moteSeeds[i];
        mAttr.setXYZ(
          i,
          s.x + Math.sin(elapsed * 0.38 * s.s + s.p) * 0.45,
          s.y + Math.sin(elapsed * 0.52 * s.s + s.p * 1.7) * 0.28,
          s.z + Math.cos(elapsed * 0.34 * s.s + s.p) * 0.42
        );
      }
      mAttr.needsUpdate = true;

      // 8. Drifting low Kathmandu valley mist curtains
      for (const mp of mistPlanes) {
        mp.mesh.position.x = mp.baseX + Math.sin(elapsed * 0.038 * mp.speed + mp.phase) * 16.0;
        mp.mesh.lookAt(camera.position.x, mp.mesh.position.y, camera.position.z);
      }

      // 9. Daytime soaring valley birds circling lazily around Boudhanath's golden spire
      if (currentDayFactor > 0.18) {
        for (const b of birdFlock) {
          const a = elapsed * b.speed + b.phase;
          b.mesh.position.set(
            STUPA_POS.x + Math.cos(a) * b.radius,
            b.height + Math.sin(elapsed * 0.72 + b.phase) * 2.0,
            STUPA_POS.z + Math.sin(a) * b.radius
          );
          b.mesh.rotation.y = -a;
          b.mesh.rotation.z = 0.24;
        }
      }

      composer.render();
    }

    // =========================================================================
    // SECTION 20: RESPONSIVE RESIZE & GRACEFUL CURTAIN REVEAL
    // =========================================================================
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloomPass.setSize(w, h);
      filmPass.uniforms.uResolution.value.set(w, h);
    });

    // Reveal scene smoothly after first frames warm up shaders & PMREM reflections
    animate();
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const curtain = document.getElementById('loading-curtain');
        if (curtain) curtain.classList.add('hidden');
      });
    });
  </script>
</body>
